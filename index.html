<script>
// no iPhone aberto pela Tela de Início (barra de status transparente) a página recebe a altura da tela menos a barra de status,
// e sobra uma faixa preta embaixo; aqui o app ocupa a altura real da tela, em qualquer modelo e orientação
try{if(JSON.parse(localStorage.getItem('br.tema')||'"dark"')==='light')document.documentElement.dataset.theme='light'}catch(e){}
(function(){
  const fit=()=>{let h=innerHeight;
    if(navigator.standalone){const deitado=innerWidth>innerHeight,s=deitado?Math.min(screen.width,screen.height):Math.max(screen.width,screen.height);h=Math.max(h,s)}
    document.documentElement.style.setProperty('--app-h',h+'px')};
  fit();addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,300));
})();
</script>
<style>
:root{--bg:#000;--panel:#0d0d0d;--line:#252a31;--blue:#4a9eff;--amber:#c9a24a;--red:#e0442f;--ok:#7cc4ff;--cy:#f2f4ee;--txt:#f2f4ee;--dim:#8a929e;--f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Inter,Arial,sans-serif;--m:ui-monospace,"SF Mono",Menlo,monospace;--hi:#fff;--cell:#070707;--panel2:#050505;--sel:#0a1828;--line2:#15181d;--inp:#000;--bad:#ff7a66;--dim2:#5c636d;--hd2:#080808;--redbg:#1a0805;--ambbg:#1a1405;--track:#12161c;--ov:rgba(0,0,0,.75);--glass:rgba(5,5,5,.9)}

  --blue:#1f74d6;--amber:#9a6a0c;--red:#cc3920;--ok:#1b68bf;--sel:#d6e5f6;--inp:#fbfcfd;--bad:#c0371f;--hd2:#e3e9ee;--redbg:#f8e2dc;--ambbg:#f5ead2;--track:#d3dbe3;--ov:rgba(25,38,52,.42);--glass:rgba(242,245,248,.93)}
:root[data-theme="light"] #top{background:linear-gradient(#1d2733,#18212c);border-bottom-color:#11181f}
:root[data-theme="light"] #top .brand b{color:#fff}:root[data-theme="light"] #top .brand small{color:#9aa7b4}
:root[data-theme="light"] #top .b{background:#26313d;border-color:#3a4654;color:#fff}
:root[data-theme="light"] #av i{border-color:#1d2733}
:root[data-theme="light"] body.ob .view img[src="logo.png"]{mix-blend-mode:multiply;filter:invert(1)}
:root[data-theme="light"] .card,:root[data-theme="light"] .day,:root[data-theme="light"] .badge{box-shadow:0 1px 2px rgba(20,40,60,.06)}
#tema{width:38px;height:38px;flex:none;border:0;background:none;color:#aab4bf;padding:0;display:flex;align-items:center;justify-content:center}
#tema svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}

button{cursor:pointer}

.view{position:absolute;left:0;right:0;top:calc(57px + env(safe-area-inset-top));bottom:calc(60px + env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px max(12px,env(safe-area-inset-left)) 28px;display:none}

.help p{font-size:13px;line-height:1.6;color:var(--txt);margin-bottom:10px}.help b{color:var(--blue);font-weight:600}

.list .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}

#sheet .hd b{color:var(--amber);letter-spacing:.14em;font-size:12px}
label.f{display:block;color:var(--dim);font-size:10px;letter-spacing:.1em;margin:10px 0 4px;text-transform:uppercase}
input,select{width:100%;background:var(--inp);border:1px solid var(--line);padding:10px;border-radius:6px;-webkit-user-select:text;user-select:text;font-size:16px}
svg.ch{width:100%;display:block}
#toast{position:absolute;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);z-index:30;background:var(--panel);border:1px solid var(--blue);color:var(--blue);padding:9px 14px;border-radius:6px;font-size:11px;letter-spacing:.1em;display:none;max-width:90%;text-align:center}
#toast.on{display:block}
.empty{color:var(--dim);font-size:12px;line-height:1.5}
.ring{display:flex;align-items:center;gap:14px}
.ring svg{width:86px;height:86px;flex:none}
.feel{display:flex;gap:6px}

.feel button.on{border-color:var(--blue);color:var(--blue);background:var(--sel)}
.map{position:relative;margin-top:10px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}.map .mimg{position:absolute;inset:0;width:100%;height:100%;display:block}.map span{position:absolute;right:6px;bottom:3px;z-index:2;font-size:8px;color:var(--dim2);letter-spacing:.02em}
#recfab{position:absolute;z-index:8;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));height:58px;min-width:58px;border-radius:29px;background:var(--glass);border:1px solid var(--blue);display:none;align-items:center;justify-content:center;gap:9px;padding:0 17px;box-shadow:0 6px 22px rgba(0,0,0,.7)}

#recfab span{display:none;font-family:var(--m);font-size:14px;color:var(--hi);font-weight:600}#recfab.live{right:auto;left:50%;transform:translateX(-50%)}#recfab.live span{display:inline}#recfab.live i{animation:pl 1.2s infinite}@keyframes pl{50%{opacity:.3}}

#v-comp{padding:0;overflow:hidden}#comp{max-width:none;height:100%;position:relative}#cmap{position:absolute;inset:0;background:var(--bg)}
.cbar{position:absolute;z-index:3;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}.cbar>*{pointer-events:auto}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:18px;background:var(--glass);border:1px solid var(--line);color:var(--txt);font-size:10px;letter-spacing:.1em;white-space:nowrap}.chip.b{color:var(--blue);border-color:var(--blue);min-width:0}
.cleg{position:absolute;z-index:3;left:10px;bottom:40px;gap:7px;font-size:9px;letter-spacing:.08em;color:var(--dim)}.cleg i{display:inline-block;width:16px;height:0;border-top:2px dashed var(--dim)}.cleg i.lf{border-top:3px solid var(--blue)}.cleg.off{opacity:.45;text-decoration:line-through}
.fab{position:absolute;z-index:3;right:12px;bottom:40px;width:50px;height:50px;border-radius:50%;background:var(--glass);border:1px solid var(--blue);color:var(--blue);font-size:22px;line-height:1;padding:0}

  #v-ini{padding-bottom:100px}
  body.ob .wrap{max-width:540px}
  #ini .map{height:250px!important}

<script src="config.local.js" onerror="void 0"></script>
<script>
'use strict';
/* ================= util ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem('br.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('br.'+k,JSON.stringify(v))}catch(e){}}};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const [y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=(x.getDay()+6)%7;return addD(x,-w)};
const TODAY=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const DOW=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const MES=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
const fmtT=s=>{if(s==null||!isFinite(s))return '--';s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+':'+pad(m)+':'+pad(x):m+':'+pad(x)};
const fmtP=spk=>{if(!spk||!isFinite(spk)||spk>1200)return '--';spk=Math.round(spk);return Math.floor(spk/60)+':'+pad(spk%60)};
const km=m=>m==null?'--':(m/1000).toFixed(m>=10000?1:2);
const fmtSleep=s=>s?Math.floor(s/3600)+'h'+pad(Math.round(s%3600/60)):'--';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function toast(t,ms=2400){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('on'),ms)}
const isRun=a=>/Run/.test(a.type||'');
// "ótimo/bom/baixo" no feminino quando o perfil do Intervals é de mulher
const gen=w=>(D.athlete||{}).sex==='F'?({'ÓTIMO':'ÓTIMA','BOM':'BOA','BAIXO':'BAIXA','ótimo':'ótima','bom':'boa','baixo':'baixa'}[w]||w):w;

/* ================= config ================= */
const CFG=Object.assign({athlete:'',key:'',fcmax:194,fcrep:52,limiar:300,longDay:0},window.LOCAL_CFG||{},LS.get('cfg',{}));
function saveCfg(){LS.set('cfg',CFG)}

/* ================= Intervals.icu ================= */
const API='https://intervals.icu/api/v1';
async function api(path,opt={}){
  if(!CFG.athlete||!CFG.key)throw new Error('SEM CHAVE');
  const r=await fetch(API+path,{...opt,headers:{Authorization:'Basic '+btoa('API_KEY:'+CFG.key),'Content-Type':'application/json',...(opt.headers||{})}});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const t=await r.text();return t?JSON.parse(t):null;
}
let D=LS.get('data',{athlete:null,acts:[],well:[],at:0});
// treinos marcados como feitos à mão que não chegaram a ser gravados no Intervals
let MAN=LS.get('man',[]);
const isMan=a=>String(a.id).startsWith('man-');
const withMan=acts=>acts.filter(a=>!isMan(a)).concat(MAN).sort((a,b)=>a.date<b.date?1:-1);
D.acts=withMan(D.acts||[]);
let AX=LS.get('ax5',{}); // análise por atividade: splits, best efforts, deriva, trajeto
const slim=a=>({id:a.id,date:a.start_date_local,type:a.type,name:a.name,dist:a.distance,mov:a.moving_time,el:a.elapsed_time,hr:a.average_heartrate,hrmax:a.max_heartrate,load:a.icu_training_load,trimp:a.trimp,elev:a.total_elevation_gain,cad:a.average_cadence,rpe:a.icu_rpe,feel:a.feel,speed:a.average_speed,src:a.source});

async function sync(full){
  const btn=$('#sync');btn.disabled=true;btn.textContent='...';
  try{
    const t=TODAY(),old=ymd(addD(t,-400)),nw=ymd(addD(t,1));
    const [ath,acts,well,evs]=await Promise.all([api('/athlete/'+CFG.athlete),api(`/athlete/${CFG.athlete}/activities?oldest=${old}&newest=${nw}`),api(`/athlete/${CFG.athlete}/wellness?oldest=${old}&newest=${nw}`),api(`/athlete/${CFG.athlete}/events?oldest=${ymd(addD(t,-60))}&newest=${ymd(addD(t,120))}&category=WORKOUT`)]);
    D={athlete:{name:ath.name,pic:ath.profile_medium,rhr:ath.icu_resting_hr,weight:ath.icu_weight,city:ath.city,
        sex:ath.sex,gAct:ath.icu_garmin_sync_activities,gWell:ath.icu_garmin_download_wellness,gUp:ath.icu_garmin_upload_workouts,
        run:(ath.sportSettings||[]).find(s=>(s.types||[]).includes('Run'))||null},
      acts:withMan((acts||[]).filter(a=>a.type).map(slim)),
      well:(well||[]).map(w=>({d:w.id,rhr:w.restingHR,sleep:w.sleepSecs,ss:w.sleepScore,hrv:w.hrv,vo2:w.vo2max,steps:w.steps,feel:w.fatigue})),
      ev:(evs||[]).filter(e=>e.category==='WORKOUT').map(e=>({id:e.id,d:e.start_date_local.slice(0,10),name:e.name})),
      at:Date.now()};
    LS.set('data',D);
    await analyzeRuns(full);
    publishMine().catch(()=>{}); // corrida nova entra no ranking público (só para quem aceitou)
    toast('SINCRONIZADO // '+D.acts.length+' ATIVIDADES');
  }catch(e){toast(e.message==='SEM CHAVE'?'CONFIGURE A CHAVE EM MAIS':'FALHA NA SINCRONIZAÇÃO // '+e.message,3500)}
  btn.disabled=false;btn.textContent='SYNC';render();
}

/* streams → parciais por km, melhores esforços, deriva cardíaca */
const BE=[[1000,'1 KM'],[3000,'3 KM'],[5000,'5 KM'],[10000,'10 KM'],[21097.5,'21 KM'],[30000,'30 KM'],[42195,'42 KM']];
async function analyzeRuns(full){
  const runs=D.acts.filter(isRun).filter(a=>!isMan(a)&&(full||!AX[a.id])).slice(0,60);
  for(const a of runs){
    try{await loadAX(a.id)}catch(e){AX[a.id]={err:1}}
  }
  LS.set('ax5',AX);
}
async function loadAX(id){
  const s=await api(`/activity/${id}/streams?types=time,distance,heartrate,velocity_smooth,altitude,latlng`);
  const f=k=>s.find(x=>x.type===k)||{},g=k=>f(k).data||[];
  AX[id]=analyze(g('time'),g('distance'),g('heartrate'),g('altitude'),f('latlng'));
}
function analyze(t,d,hr,alt,ll){
  const out={splits:[],best:{},dec:null,chart:null};
  if(!t.length||!d.length)return out;
  // saltos de GPS: trecho acima de 6,5 m/s (2:34/km) não conta distância
  const c=[d[0]||0];for(let i=1;i<d.length;i++){const dd=(d[i]||0)-(d[i-1]||0),dt=(t[i]-t[i-1])||1;c.push(c[i-1]+(dd>0&&dd/dt<=6.5?dd:0))}
  d=c;
  // pausas: intervalo acima de 30 s vira o tempo que levaria no ritmo anterior
  const tm=[0];for(let i=1;i<t.length;i++){const dt=t[i]-t[i-1],dd=d[i]-d[i-1];let e=dt;if(dt>30){const pt=i>1?t[i-1]-t[i-2]:0,v=pt>0&&pt<=30?(d[i-1]-d[i-2])/pt:3;e=dd>0?dd/clamp(v,1.5,6):0}tm.push(tm[i-1]+e)}
  t=tm;
  // parciais por km
  let k=1,i0=0,t0=t[0];
  for(let i=1;i<d.length;i++){
    if(d[i]>=k*1000){
      const f=(k*1000-d[i-1])/((d[i]-d[i-1])||1),tk=t[i-1]+f*(t[i]-t[i-1]);
      const h=hr.slice(i0,i+1).filter(Boolean),hv=h.length?Math.round(h.reduce((x,y)=>x+y,0)/h.length):null;
      const el=alt.length?Math.round(alt[i]-alt[i0]):null;
      out.splits.push({km:k,t:tk-t0,hr:hv,el});t0=tk;i0=i;k++;
    }
  }
  const rest=d[d.length-1]-(k-1)*1000;
  if(rest>100){const h=hr.slice(i0).filter(Boolean);out.splits.push({km:k-1+rest/1000,part:rest,t:t[t.length-1]-t0,hr:h.length?Math.round(h.reduce((x,y)=>x+y,0)/h.length):null,el:alt.length?Math.round(alt[alt.length-1]-alt[i0]):null})}
  // melhores esforços (janela deslizante)
  for(const [dist] of BE){
    if(d[d.length-1]<dist)continue;
    let j=0,best=Infinity;
    for(let i=0;i<d.length;i++){
      while(j<d.length&&d[j]-d[i]<dist)j++;
      if(j>=d.length)break;
      const f=(dist-(d[j-1]-d[i]))/((d[j]-d[j-1])||1),tt=(t[j-1]+f*(t[j]-t[j-1]))-t[i];
      if(tt>0&&tt<best)best=tt;
    }
    if(isFinite(best))out.best[dist]=Math.round(best);
  }
  // deriva cardíaca (ritmo/FC 1ª metade vs 2ª)
  if(hr.length===t.length){
    const mv=[];for(let i=1;i<t.length;i++){const dt=t[i]-t[i-1],dd=d[i]-d[i-1];if(dt>0&&dt<=10&&dd/dt>1.6&&hr[i])mv.push([dt,dd,hr[i]])}
    const tot=mv.reduce((s,x)=>s+x[0],0);
    if(tot>1200){let acc=0,h1=[0,0,0],h2=[0,0,0];for(const x of mv){const h=(acc+=x[0])<=tot/2?h1:h2;h[0]+=x[0];h[1]+=x[1];h[2]+=x[2]*x[0]}
      const e1=(h1[1]/h1[0])/(h1[2]/h1[0]),e2=(h2[1]/h2[0])/(h2[2]/h2[0]),dec=Math.round((e1-e2)/e1*1000)/10;if(Math.abs(dec)<=30)out.dec=dec}
  }
  // gráfico reduzido (até 120 pontos)
  const n=Math.max(1,Math.floor(t.length/120));const P=[],H=[];
  for(let i=n;i<t.length;i+=n){const dd=d[i]-d[i-n],tt=t[i]-t[i-n];P.push(dd>0?tt/dd*1000:null);H.push(hr[i]||null)}
  out.chart={p:P,h:H};
  // trajeto reduzido (até ~300 pontos); o Intervals manda a latitude em data e a longitude em data2
  if(ll&&ll.data&&ll.data2){const la=ll.data,lo=ll.data2,st=Math.max(1,Math.ceil(la.length/300)),tr=[];
    const ix=[];for(let i=0;i<la.length;i+=st)ix.push(i);if(ix[ix.length-1]!==la.length-1)ix.push(la.length-1);
    for(const i of ix){if(la[i]==null||lo[i]==null||(!la[i]&&!lo[i]))continue;const q=tr[tr.length-1];
      if(q&&Math.abs(la[i]-q[0])+Math.abs(lo[i]-q[1])>0.005)continue; // salto de GPS
      tr.push([+la[i].toFixed(5),+lo[i].toFixed(5)])}
    if(tr.length>1)out.map=tr}
  return out;
}

/* ================= motor analítico ================= */
// carga do dia: HRSS do Intervals; sem ele, TRIMP de Banister pela FC média
function loadOf(a){
  if(a.load!=null)return a.load;
  if(a.hr&&a.mov){const r=clamp((a.hr-CFG.fcrep)/(CFG.fcmax-CFG.fcrep),0,1);return a.mov/60*r*0.64*Math.exp(1.92*r)}
  return 0;
}
function pmc(){ // CTL 42 d, ATL 7 d (EWMA), TSB = CTL − ATL do dia anterior
  const byDay={};for(const a of D.acts){const k=a.date.slice(0,10);byDay[k]=(byDay[k]||0)+loadOf(a)}
  const t=TODAY();let d=addD(t,-400),ctl=0,atl=0;const S=[];
  while(d<=t){const L=byDay[ymd(d)]||0;const tsb=ctl-atl;ctl+=(L-ctl)/42;atl+=(L-atl)/7;S.push({d:ymd(d),L,ctl,atl,tsb});d=addD(d,1)}
  return S;
}
// VDOT (Daniels & Gilbert)
function vdot(dist,sec){const m=sec/60,v=dist/m;const vo2=-4.6+0.182258*v+0.000104*v*v;const p=0.8+0.1894393*Math.exp(-0.012778*m)+0.2989558*Math.exp(-0.1932605*m);return vo2/p}
function predict(V,dist){let lo=dist/1000*120,hi=dist/1000*600;for(let i=0;i<50;i++){const mid=(lo+hi)/2;vdot(dist,mid)>V?lo=mid:hi=mid}return (lo+hi)/2}
function bests(days){
  const lim=days?ymd(addD(TODAY(),-days)):'0';const B={};
  for(const a of D.acts){if(!isRun(a)||a.date<lim||a.type==='TrailRun'||/trilha|trail/i.test(a.name||''))continue;const x=AX[a.id];if(!x||!x.best)continue;
    for(const k in x.best){if(!B[k]||x.best[k]<B[k].t)B[k]={t:x.best[k],id:a.id,date:a.date}}
    // corrida com a distância exata: vale o tempo em movimento (sem as paradas)
    for(const [dist] of BE){if(a.dist>=dist*0.99&&a.dist<=dist*1.05&&a.mov){const tt=Math.round(a.mov*dist/a.dist);if(!B[dist]||tt<B[dist].t)B[dist]={t:tt,id:a.id,date:a.date}}}}
  return B;
}
function curVdot(){const B=bests(90);let best=null;for(const k in B){const dist=+k;if(dist<1500)continue;const v=vdot(dist,B[k].t);if(!best||v>best.v)best={v,dist,t:B[k].t}}return best}
function paceZones(V){ // ritmos de treino a partir do VDOT (% do VO2 máx)
  const vv=(v)=>{let lo=100,hi=500;for(let i=0;i<40;i++){const mid=(lo+hi)/2;(-4.6+0.182258*mid+0.000104*mid*mid)<v?lo=mid:hi=mid}return lo};
  const p=f=>60000/vv(V*f);
  return {E:[p(0.74),p(0.65)],M:[p(0.84),p(0.80)],T:[p(0.88),p(0.86)],I:[p(1.0),p(0.97)],R:[p(1.10),p(1.05)]};
}
const W=d=>D.well.find(w=>w.d===d);
function readiness(dt){
  const ds=ymd(dt),w=W(ds)||{},S=pmc(),p=S.find(x=>x.d===ds)||S[S.length-1];
  const base=D.well.filter(x=>x.d<ds&&x.d>=ymd(addD(dt,-28))&&x.rhr).map(x=>x.rhr);
  const rb=base.length?base.reduce((a,b)=>a+b,0)/base.length:null;
  let sc=0,parts=[];
  const sl=w.sleep;const sp=sl?40*clamp(sl/(7.5*3600),0,1):24;sc+=sp;parts.push(['SONO',sl?fmtSleep(sl):'--',sp/40]);
  let rp=22;if(w.rhr&&rb){const dl=w.rhr-rb;rp=30-clamp(dl,0,6)*5}sc+=rp;parts.push(['FC REPOUSO',w.rhr?w.rhr+(rb?(w.rhr-rb>=0?' (+':' (')+(w.rhr-rb).toFixed(0)+')':''):'--',rp/30]);
  const tp=30*clamp((p.tsb+30)/20,0,1);sc+=tp;parts.push(['EQUILÍBRIO',(Math.round(p.tsb*10)/10||0).toFixed(1),tp/30]);
  const ck=LS.get('ck',{})[ds];if(ck){sc+=(ck-3)*4}
  sc=Math.round(clamp(sc,0,100));
  return {sc,parts,st:gen(sc>=75?'ÓTIMO':sc>=50?'BOM':'BAIXO'),cls:sc>=75?'ok':sc>=50?'warn':'bad',w,rb,p};
}

/* ================= plano (microciclos) ================= */
// passos: [tipo, duração, ritmo seg/km [min,max] ou null, repetições]
const EZ=[370,390],LONG=[360,390];
function planIgor(){
  const P=[];const add=(d,o)=>P.push({date:d,...o});
  add('2026-11-01',{tipo:'longo',titulo:'Longão de abertura',km:6,steps:[['Contínuo','6km',LONG]]});
  const wk=[
    {q:{titulo:'Tiros curtos 6×200 m',km:4.5,steps:[['Aquecer','1.5km',EZ],['Tiro','200m',[205,215],6],['Rec.','200m',[400,440],6],['Desaquecer','1.5km',EZ]]},e:5,l:7},
    {q:{titulo:'Ritmo 3×1 km',km:6,steps:[['Aquecer','1.5km',EZ],['Ritmo','1km',[295,305],3],['Rec.','2min',[400,450],3],['Desaquecer','1.5km',EZ]]},e:5,l:8},
    {q:{titulo:'Limiar 2×2 km',km:7,steps:[['Aquecer','1.5km',EZ],['Limiar','2km',[305,315],2],['Rec.','3min',[400,450],2],['Desaquecer','1.5km',EZ]]},e:5,l:9,lt:'9 km, os 3 finais a 5:30'},
    {q:{titulo:'Soltura com 4 acelerações',km:5,steps:[['Contínuo','4km',EZ],['Aceleração','100m',[240,260],4],['Rec.','1min',null,4]]},e:4,l:10,lt:'OBJETIVO 10 km a 5:15–5:30',alvo:1},
  ];
  wk.forEach((w,i)=>{
    const m=addD(parseD('2026-11-02'),i*7);

function coachLast(a){
  const x=AX[a.id]||{},p=planOn(a.date.slice(0,10)),pace=a.mov&&a.dist?a.mov/a.dist*1000:null;
  const z=D.athlete&&D.athlete.run&&D.athlete.run.hr_zones||[148,157,166,175,180,185,194];
  const msg=[];
  // sessão intervalada: ritmo muito variável (coef. de variação > 25%) ou plano de qualidade
  const pv=(x.chart&&x.chart.p||[]).filter(v=>v&&v<900),mu=pv.reduce((s,v)=>s+v,0)/(pv.length||1);
  const cv=pv.length?Math.sqrt(pv.reduce((s,v)=>s+(v-mu)**2,0)/pv.length)/mu:0;
  const fast=[...pv].sort((m,n)=>m-n).slice(0,Math.max(1,Math.round(pv.length*0.15))),fm=fast.length?fast.reduce((s,v)=>s+v,0)/fast.length:0;
  const inter=p?.tipo==='qualidade'||/tiro|interval/i.test(a.name||'')||(cv>0.25&&fm&&fm<330);
  if(inter){
    msg.push(`Sessão intervalada. Trechos rápidos em torno de ${fmtP(fm)}/km, FC máxima ${a.hrmax||'--'} bpm.`);
    if(a.hrmax&&a.hrmax>=CFG.fcmax*0.95)msg.push('Chegou perto da FC máxima: estímulo forte, próximo treino deve ser leve.');
    return (p?`Planejado: ${p.titulo}. `:'')+msg.join(' ');
  }
  if(p){const r=a.dist/1000/p.km;msg.push(r>=0.95?`Treino cumprido: ${km(a.dist)} de ${p.km} km planejados.`:r>=0.8?`Volume quase completo (${Math.round(r*100)}% do planejado).`:`Volume abaixo do planejado (${Math.round(r*100)}%). Sem problema na fase de retorno; não compensar no próximo treino.`)}
  if(a.hr){const zi=z.findIndex(v=>a.hr<=v)+1;msg.push(`FC média ${a.hr} bpm (Z${zi||7})${zi<=2?': esforço aeróbico, base sendo construída.':zi<=4?': sessão moderada a forte.':': sessão intensa, priorizar recuperação.'}`)}
  if(x.dec!=null&&!p?.tipo?.match(/qualidade/))msg.push(x.dec<=5?`Deriva cardíaca ${x.dec}%: boa resistência aeróbica para esta duração.`:`Deriva cardíaca ${x.dec}%: a FC subiu no fim. Sinal de base aeróbica ainda curta; manter rodagens leves.`);
  if(x.splits&&x.splits.length>=3){const s=x.splits.filter(s=>!s.part);if(s.length>=3){const f=s[0].t,l=s[s.length-1].t;msg.push(l<f-5?'Parciais em progressão negativa: boa disciplina de ritmo.':l>f+15?'Ritmo caiu no fim; segurar mais o início.':'Ritmo estável do começo ao fim.')}}
  if(!msg.length&&pace)msg.push(`Ritmo médio ${fmtP(pace)}/km.`);
  return msg.join(' ');
}

const fmtD=ds=>ds.slice(8,10)+'/'+ds.slice(5,7);

function barsSvg(vals,days,target,col){
  const w=600,h=140,n=vals.length,mx=Math.max(target||0,...vals.filter(v=>v!=null))*1.12||1,bw=w/n,y=v=>h-v/mx*h;
  return `<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:140px;border-bottom:1px solid var(--line)">${vals.map((v,i)=>v==null?'':`<rect x="${(i*bw+bw*.15).toFixed(1)}" y="${y(v).toFixed(1)}" width="${Math.max(1,bw*.7).toFixed(1)}" height="${(h-y(v)).toFixed(1)}" fill="${col(v)}"/>`).join('')}${target?`<line x1="0" x2="${w}" y1="${y(target)}" y2="${y(target)}" stroke="#c9a24a" stroke-width="1.5" stroke-dasharray="6 5"/>`:''}</svg><div class="row meta" style="justify-content:space-between;margin-top:3px"><span>${fmtD(days[0])}</span><span>${fmtD(days[days.length-1])}</span></div>`;
}
function lineSvg(vals,days,col,ref){
  const pts=vals.map((v,i)=>[i,v]).filter(p=>p[1]!=null);if(!pts.length)return '<p class="empty">Sem dados no período.</p>';
  const w=600,h=140,vs=pts.map(p=>p[1]).concat(ref?[ref]:[]),mn=Math.min(...vs)-2,mx=Math.max(...vs)+2,x=i=>vals.length>1?i/(vals.length-1)*w:w/2,y=v=>h-8-(v-mn)/((mx-mn)||1)*(h-16);
  return `<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:140px;border-bottom:1px solid var(--line)">${ref?`<line x1="0" x2="${w}" y1="${y(ref)}" y2="${y(ref)}" stroke="#c9a24a" stroke-width="1.5" stroke-dasharray="6 5"/>`:''}<polyline fill="none" stroke="${col}" stroke-width="2" points="${pts.map(p=>x(p[0]).toFixed(1)+','+y(p[1]).toFixed(1)).join(' ')}"/>${pts.length<25?pts.map(p=>`<circle cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="4" fill="${col}"/>`).join(''):''}</svg><div class="row meta" style="justify-content:space-between;margin-top:3px"><span>${fmtD(days[0])} · ${Math.round(mn+2)}–${Math.round(mx-2)}</span><span>${fmtD(days[days.length-1])}</span></div>`;
}

let calMode='sem',calRef=TODAY();
function rCal(){
  const ds0=ymd(TODAY());let h=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><div class="seg"><button class="${calMode==='sem'?'on':''}" onclick="calSet('sem')">SEMANAL</button><button class="${calMode==='mes'?'on':''}" onclick="calSet('mes')">MENSAL</button></div><div class="row"><button class="b sm" onclick="calGo(0)">HOJE</button><button class="b sm pri" onclick="openBuilder()" aria-label="Criar treino">+ TREINO</button></div></div>`;
  if(calMode==='sem'){
    const m=monday(calRef),e=addD(m,6);let tk=0,pk=0;
    h+=`<div class="wk"><button class="b sm" onclick="calGo(-1)">◀</button><b>${m.getDate()} ${MES[m.getMonth()]} — ${e.getDate()} ${MES[e.getMonth()]}</b><button class="b sm" onclick="calGo(1)">▶</button></div>`;
    h+='<div class="week">';
    for(let i=0;i<7;i++){const d=addD(m,i),ds=ymd(d),p=planOn(ds),ex=actsOn(ds),w=W(ds)||{};
      const rk=ex.filter(isRun).reduce((s,a)=>s+(a.dist||0),0);tk+=rk;pk+=p?p.km*1000:0;
      h+=`<div class="day ${ds===ds0?'today':''}" onclick="openDay('${ds}')"><div class="d"><span>${DOW[d.getDay()]}</span><b>${pad(d.getDate())}</b></div><div style="min-width:0">
      ${p?`<div class="pl"><span class="tag ${status(p)==='cumprido'?'ok':status(p)==='perdido'?'bad':''}">${tipoIc[p.tipo]}</span> ${esc(p.titulo)} <span class="dim">· ${p.km} km</span></div>`:`<div class="pl dim">${ex.length?'':'Descanso'}</div>`}
      ${ex.map(a=>`<div class="ex">✓ ${typeIc(a)} ${a.dist?km(a.dist)+' km':fmtT(a.mov)}${isRun(a)&&a.dist?' · '+fmtP(a.mov/a.dist*1000)+'/km':''}${a.hr?' · '+a.hr+' bpm':''}</div>`).join('')}</div>
      <div class="vt">${w.sleep?'☾ '+fmtSleep(w.sleep):''}<br>${w.rhr?'♥ '+w.rhr:''}</div></div>`}
    h+='</div>';
    h+=`<div class="card" style="margin-top:8px"><div class="row" style="justify-content:space-between"><span class="lbl">Volume da semana</span><span class="num">${pk?km(tk)+' / '+km(pk):km(tk)} km</span></div>${pk?`<div class="bar"><i style="width:${clamp(tk/pk*100,0,100)}%"></i></div>`:'<div class="meta" style="margin-top:4px">Sem treinos planejados nesta semana.</div>'}</div>`;
  }else{
    const y=calRef.getFullYear(),mo=calRef.getMonth(),f=monday(new Date(y,mo,1));
    h+=`<div class="wk"><button class="b sm" onclick="calGo(-1)">◀</button><b>${MES[mo]} ${y}</b><button class="b sm" onclick="calGo(1)">▶</button></div><div class="mgrid">${['SEG','TER','QUA','QUI','SEX','SÁB','DOM'].map(x=>`<div class="h">${x}</div>`).join('')}`;
    let tot=0;
    for(let i=0;i<42;i++){const d=addD(f,i),ds=ymd(d);if(i>=35&&d.getMonth()!==mo)break;const p=planOn(ds),rk=runsOn(ds).reduce((s,a)=>s+(a.dist||0),0),st=p&&status(p);if(d.getMonth()===mo)tot+=rk;
      h+=`<div class="mc ${d.getMonth()!==mo?'out':''} ${ds===ds0?'today':''}" onclick="openDay('${ds}')"><span class="n">${d.getDate()}</span>${rk?`<span class="k">${(rk/1000).toFixed(1)}</span>`:p?`<span class="k p">${p.km}</span>`:'<span></span>'}${p?`<span class="dot ${st==='cumprido'||st==='parcial'?'f':st==='perdido'?'x':''}"></span>`:rk?'<span class="dot f"></span>':'<span></span>'}</div>`}
    h+=`</div><div class="row meta" style="gap:14px;margin-top:8px"><span><span style="color:var(--blue)">●</span> cumprido</span><span><span style="color:var(--blue)">○</span> planejado</span><span style="color:var(--bad)">● perdido</span></div><div class="card" style="margin-top:10px"><div class="row" style="justify-content:space-between"><span class="lbl">Total corrido no mês</span><span class="num">${km(tot)} km</span></div></div>`;
  }
  $('#cal').innerHTML=h;
}
window.calSet=m=>{calMode=m;rCal()};
window.calGo=n=>{if(!n)calRef=TODAY();else if(calMode==='sem')calRef=addD(calRef,7*n);else calRef=new Date(calRef.getFullYear(),calRef.getMonth()+n,1);rCal()};
window.openDay=ds=>{
  const p=planOn(ds),ex=actsOn(ds),w=W(ds)||{},d=parseD(ds);
  let h=`<div class="hd"><b>${DOW[d.getDay()]} ${ds.split('-').reverse().join('/')}</b><button class="b sm" onclick="closeSheet()">✕</button></div>`;
  if(p)h+=`<div class="card cur"><div class="row" style="justify-content:space-between"><span class="lbl">PLANEJADO · ${tipoIc[p.tipo]}</span>${tagSt[status(p)]}</div><h2 style="margin-top:4px">${esc(p.titulo)}</h2><div class="meta">${p.km} km</div>${stepsHtml(p)}${p.why?`<div class="coach"><b>AJUSTE DO COACH</b>${esc(p.why)}</div>`:''}${ds>=ymd(TODAY())&&hasWatch()?`<button class="b pri full" style="margin-top:10px" onclick="sendWatch('${ds}')">▲ Enviar ao relógio</button>`:''}
    ${ds>=ymd(TODAY())?`<button class="b ${hasWatch()?'':'pri'} full" style="margin-top:8px" onclick="fazerTreino('${ds}')">▶ Fazer treino agora</button>`:''}
    <div class="grid g2" style="margin-top:8px">${ds<=ymd(TODAY())&&status(p)!=='cumprido'?`<button class="b" onclick="markDone('${ds}')">✓ Marcar feito</button>`:''}${ds>=ymd(TODAY())?`<button class="b" onclick="openBuilder('${ds}')">Editar treino</button>`:''}</div></div>`;
  ex.forEach(a=>h+=`<div class="card" onclick="openAct('${a.id}')"><div class="row" style="justify-content:space-between"><span class="lbl">EXECUTADO · ${typeIc(a)}</span>${a.src==='MANUAL'?'<span class="tag">MARCADO À MÃO</span>':''}</div><h2 style="margin-top:4px">${esc(a.name)}</h2><div class="meta">${a.dist?km(a.dist)+' km · ':''}${fmtT(a.mov)}${isRun(a)&&a.dist?' · '+fmtP(a.mov/a.dist*1000)+'/km':''}${a.hr?' · '+a.hr+' bpm':''}</div>${isMan(a)?`<button class="b sm" style="margin-top:8px" onclick="event.stopPropagation();undoMan('${a.id}')">Desfazer</button>`:''}</div>`);
  if(!p&&!ex.length)h+=`<p class="empty">Dia de descanso.</p>`;
  if(!p&&ds>=ymd(TODAY()))h+=`<button class="b full" style="margin:8px 0" onclick="openBuilder('${ds}')">+ Criar treino neste dia</button>`;
  if(!p&&!ex.some(isRun)&&ds<=ymd(TODAY()))h+=`<button class="b full" style="margin:8px 0" onclick="markDone('${ds}')">✓ Registrar corrida feita</button>`;
  h+=`<div class="grid g3" style="margin-top:6px"><div class="cell"><div class="lbl">Sono</div><span class="num">${fmtSleep(w.sleep)}</span></div><div class="cell"><div class="lbl">FC rep.</div><span class="num">${w.rhr||'--'}</span></div><div class="cell"><div class="lbl">Passos</div><span class="num">${w.steps?(w.steps/1000).toFixed(1)+'k':'--'}</span></div></div>`;
  openSheet(h);
};

// metas com prazo: cumpridas quando uma corrida dentro da janela atinge a distância (e o tempo, se houver)
const METAS=[
  {nome:'10 KM EM NOVEMBRO',dist:10000,tempo:3300,ini:'2026-11-01',fim:'2026-11-30',txt:'Correr 10 km em até 55:00 (ritmo de 5:30/km).'},
  {nome:'MEIA MARATONA',dist:21097.5,ini:'2026-11-01',fim:'2026-12-31',txt:'Completar 21,1 km até o fim de dezembro.'},
  {nome:'30 KM',dist:30000,ini:'2026-11-01',fim:'2027-03-31',txt:'Passar o recorde de 26 km e fechar os 30 km.'},
];
// metas editáveis: ficam neste aparelho; enquanto a pessoa não mexe, valem as metas de partida (as do Igor ou a do questionário)
// tipo 'corrida' = uma corrida de X km (com tempo alvo opcional); 'volume' = somar X km entre o início e o prazo
function metas(){
  const L=LS.get('metas',null);if(L)return L;
  if(isIgor()&&!PF)return METAS.map((m,i)=>({id:'m'+(i+1),tipo:'corrida',...m}));
  const M=PF&&META[PF.meta];if(!M||!M.d)return [];
  const P=baseTemplate(),fim=P.length?P[P.length-1].date:PF.inicio;
  return [{id:'plano',tipo:'corrida',nome:M.n.toUpperCase(),dist:M.dist,ini:PF.inicio,fim}];
}
const parseT=s=>{const p=String(s||'').trim().split(':').map(Number);if(!s||p.some(isNaN))return null;return p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:p[0]*60};
const kmF=m=>kmTxt(Math.round(m/100)/10);
function metaTxt(m){
  if(m.txt)return m.txt;
  if(m.tipo==='volume')return `Somar ${kmF(m.dist)} km de corrida até ${m.fim.split('-').reverse().join('/')}.`;
  return `Correr ${kmF(m.dist)} km${m.tempo?` em até ${fmtT(m.tempo)} (ritmo de ${fmtP(m.tempo/m.dist*1000)}/km)`:''} até ${m.fim.split('-').reverse().join('/')}.`;
}
function bestIn(a,dist){
  let b=(AX[a.id]&&AX[a.id].best||{})[dist]||null;
  if(a.dist>=dist*0.99&&a.dist<=dist*1.05&&a.mov){const tt=Math.round(a.mov*dist/a.dist);if(!b||tt<b)b=tt}
  return b;
}
function metaStatus(m){
  const hoje=ymd(TODAY()),dias=Math.round((parseD(m.fim)-TODAY())/864e5),janela=D.acts.filter(a=>isRun(a)&&a.date.slice(0,10)>=m.ini&&a.date.slice(0,10)<=m.fim);
  if(m.tipo==='volume'){const tot=janela.reduce((s,a)=>s+(a.dist||0),0);return {ok:tot>=m.dist,tot,prog:tot/m.dist,dias,fora:hoje>m.fim,antes:hoje<m.ini}}
  const maior=Math.max(0,...janela.map(a=>a.dist||0));
  const runs=janela.filter(a=>a.dist>=m.dist*0.99);
  let best=null;for(const a of runs){const t=bestIn(a,m.dist)||a.mov;if(t&&(!best||t<best.t))best={t,a}}
  return {ok:!!best&&(!m.tempo||best.t<=m.tempo),best,prog:best?(m.tempo?Math.min(1,m.tempo/best.t):1):maior/m.dist,maior,dias,fora:hoje>m.fim,antes:hoje<m.ini};
}
function rDes(){
  const t=TODAY(),m=monday(t),runs=D.acts.filter(isRun);
  const sum=(a,b)=>runs.filter(x=>x.date.slice(0,10)>=a&&x.date.slice(0,10)<=b).reduce((s,x)=>s+(x.dist||0),0)/1000;
  const wk=sum(ymd(m),ymd(addD(m,6))),wkPlan=plan().filter(p=>p.date>=ymd(m)&&p.date<=ymd(addD(m,6))).reduce((s,p)=>s+p.km,0)||15;
  const m1=ymd(new Date(t.getFullYear(),t.getMonth(),1)),m2=ymd(new Date(t.getFullYear(),t.getMonth()+1,0));
  const mo=sum(m1,ymd(t)),moAlvo=isIgor()?(t.getMonth()===10?75:60):Math.round(plan().filter(p=>p.date>=m1&&p.date<=m2).reduce((s,p)=>s+p.km,0))||Math.round(wkPlan*4);
  let seq=0;for(let i=0;i<52;i++){const a=addD(m,-7*i),n=runs.filter(x=>x.date.slice(0,10)>=ymd(a)&&x.date.slice(0,10)<=ymd(addD(a,6))).length;if(n>=2)seq++;else if(i>0)break}
  const ch=[
    ['VOLUME DA SEMANA',`${wk.toFixed(1)} / ${wkPlan} km`,wk/wkPlan],
    [`VOLUME DE ${MES[t.getMonth()]}`,`${mo.toFixed(1)} / ${moAlvo} km`,mo/moAlvo],
    ['CONSTÂNCIA',`${seq} / 4 semanas seguidas com 2+ corridas`,seq/4],
  ];
  let h=`<div class="sec">PROGRESSO</div>`;
  h+=ch.map(c=>{const v=clamp(c[2],0,1);return `<div class="card ${v>=1?'cur':''}"><div class="row" style="justify-content:space-between"><span class="lbl" style="color:var(--txt)">${c[0]}</span><span class="num ${v>=1?'ok':''}" style="font-size:12px">${Math.round(v*100)}%</span></div><div class="meta" style="margin-top:3px">${c[1]}</div><div class="bar"><i style="width:${v*100}%"></i></div></div>`}).join('');
  h+=`<div class="sec"><span>METAS</span><button class="b sm pri" onclick="openMeta()">+ NOVA META</button></div>`;
  const MT=metas();
  if(!MT.length)h+=`<div class="card"><p class="empty">Nenhuma meta ainda. Toque em <b style="color:var(--hi)">+ Nova meta</b> para criar a sua: uma prova, uma distância nova ou um volume de km no mês.</p></div>`;
  h+=MT.map(mt=>{const s=metaStatus(mt),v=clamp(s.prog||0,0,1),vol=mt.tipo==='volume';
    return `<div class="card ${s.ok?'cur':s.fora?'alert':''}" onclick="openMeta('${esc(mt.id)}')"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="lbl" style="color:var(--txt)">${esc(mt.nome)}</span><span class="row" style="flex-wrap:nowrap;gap:8px">${s.ok?'<span class="tag ok">✓ CUMPRIDA</span>':s.fora?'<span class="tag bad">PRAZO ENCERRADO</span>':'<span class="tag">PENDENTE</span>'}<span class="dim" style="font-size:14px">✎</span></span></div>
    <div class="meta" style="margin-top:4px;color:var(--txt)">${esc(metaTxt(mt))}</div>
    <div class="bar"><i style="width:${v*100}%"></i></div>
    <div class="row meta" style="justify-content:space-between;margin-top:6px"><span>${vol?`${kmF(s.tot)} de ${kmF(mt.dist)} km`:s.best?(mt.tempo?'Melhor: '+fmtT(s.best.t):'Distância feita'):`Maior corrida: ${kmF(s.maior)} km`}</span><span>${s.ok&&!vol?'Feita em '+fmtD(s.best.a.date)+(mt.tempo?' · '+fmtT(s.best.t):''):s.ok?'Concluída':s.fora?'Prazo: '+mt.fim.split('-').reverse().join('/'):s.antes?'Começa em '+fmtD(mt.ini):'Faltam '+s.dias+' dias'}</span></div>
    ${!s.ok&&s.best&&mt.tempo?`<div class="meta" style="margin-top:4px">Faltam ${fmtT(s.best.t-mt.tempo)} para o tempo alvo.</div>`:''}</div>`}).join('');
  const M=PF&&META[PF.meta];
  h+=`<div class="sec">OBJETIVO DO PLANO</div><div class="card"><p class="empty" style="color:var(--txt)">${PF?`Seus treinos seguem o objetivo <b style="color:var(--hi)">${M?M.n:'do questionário'}</b>, com os dias e o volume que você informou.`:'Seus treinos seguem o plano de novembro montado pelo Coach.'}</p>
    <p class="empty" style="margin-top:6px">Mudou de objetivo, de dias ou de ritmo? Responda o questionário de novo e o app refaz o plano. A meta do objetivo aparece aqui sozinha.</p>
    <button class="b full" style="margin-top:10px" onclick="redoPlan()">Mudar meu objetivo</button></div>`;
  $('#des').innerHTML=h;
}

  <p class="empty" style="margin-top:10px">Conta qualquer corrida dentro do período. Na meta de uma corrida, vale o melhor trecho da distância dentro das suas corridas.</p>`);
};
window.metaIdeia=(n,t,k)=>{$('#mt-nome').value=n;$('#mt-tipo').value=t;$('#mt-km').value=kmTxt(k);$('#mt-tw').style.display=t==='volume'?'none':'';if(t==='volume'){const d=TODAY();$('#mt-ini').value=ymd(new Date(d.getFullYear(),d.getMonth(),1));$('#mt-fim').value=ymd(new Date(d.getFullYear(),d.getMonth()+1,0))}};
window.saveMeta=id=>{
  const k=parseFloat(String($('#mt-km').value).replace(',','.')),tipo=$('#mt-tipo').value,ini=$('#mt-ini').value,fim=$('#mt-fim').value,nome=$('#mt-nome').value.trim().toUpperCase();
  if(!nome)return toast('DÊ UM NOME À META');if(!(k>0))return toast('INFORME A DISTÂNCIA');if(!ini||!fim||fim<ini)return toast('CONFIRA AS DATAS');
  const t=tipo==='corrida'?parseT($('#mt-t').value):null;if(tipo==='corrida'&&$('#mt-t').value.trim()&&!t)return toast('TEMPO NO FORMATO 55:00 OU 1:45:00');
  const m={id:id||'u'+Date.now(),tipo,nome,dist:Math.abs(k-21.1)<.01?21097.5:Math.abs(k-42.2)<.01?42195:Math.round(k*1000),ini,fim,...(t?{tempo:t}:{}),...($('#mt-txt').value.trim()?{txt:$('#mt-txt').value.trim()}:{})};
  const L=metas().filter(x=>x.id!==m.id);L.push(m);L.sort((a,b)=>a.fim<b.fim?-1:1);LS.set('metas',L);closeSheet();toast('META SALVA');render();

window.delMeta=id=>{if(!confirm('Apagar esta meta?'))return;LS.set('metas',metas().filter(x=>x.id!==id));closeSheet();toast('META APAGADA');render()};

/* ================= etapas (voltas) do relógio: lê o arquivo original .fit da corrida ================= */
// formato FIT da Garmin: cabeçalho, mensagens de definição e de dados; só as voltas (mensagem 19) interessam
function fitLaps(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);
  if(buf.byteLength<14||String.fromCharCode(u8[8],u8[9],u8[10],u8[11])!=='.FIT')return null;
  const hs=u8[0],end=Math.min(buf.byteLength,hs+dv.getUint32(4,true)),defs={},laps=[];let p=hs;
  const INV={1:127,2:255,3:32767,4:65535,5:2147483647,6:4294967295,0:255,13:255};
  const rd=(o,sz,t,le)=>{let v;
    switch(t){case 1:v=dv.getInt8(o);break;case 3:v=dv.getInt16(o,le);break;case 4:case 11:v=dv.getUint16(o,le);break;case 5:v=dv.getInt32(o,le);break;case 6:case 12:v=dv.getUint32(o,le);break;case 0:case 2:case 10:case 13:v=dv.getUint8(o);break;default:return null}
    return INV[t]===v?null:v};
  try{
    while(p<end){
      const h0=u8[p++];
      if(h0&0x80){const d=defs[(h0>>5)&3];if(!d)return null;p+=d.size;continue}
      const lt=h0&0x0f;
      if(h0&0x40){p++;const le=u8[p++]===0,gn=dv.getUint16(p,le);p+=2;const nf=u8[p++],f=[];let size=0;
        for(let i=0;i<nf;i++){f.push([u8[p],u8[p+1],u8[p+2]&0x1f]);size+=u8[p+1];p+=3}
        if(h0&0x20){const nd=u8[p++];for(let i=0;i<nd;i++){size+=u8[p+1];p+=3}} // campos de desenvolvedor
        defs[lt]={gn,le,f,size}}
      else{const d=defs[lt];if(!d)return null;
        if(d.gn===19){let o=p;const m={};for(const [n,sz,t] of d.f){if(n===7||n===8||n===9||n===15||n===16||n===24||n===71){const sizes={0:1,1:1,2:1,3:2,4:2,5:4,6:4,10:1,11:2,12:4,13:1};if(sizes[t]===sz)m[n]=rd(o,sz,t,d.le)}o+=sz}
          laps.push({t:m[8]!=null?m[8]/1000:null,d:m[9]!=null?m[9]/100:null,hr:m[15],hm:m[16],trig:m[24],idx:m[71]})}
        p+=d.size}
    }
  }catch(e){return null}
  return laps.length?laps:null;
}
// junta voltas seguidas do mesmo passo do treino (o aquecimento de 1,5 km vem em duas voltas: 1 km + 0,5 km)
function mergeLaps(L){
  const V=L.filter(l=>l.t&&l.d);
  // corrida livre com voltas automáticas de 1 km (e a última volta encerrada ao parar o relógio): não é treino por etapas
  if(!V.some(l=>l.idx!=null)&&!V.some((l,i)=>l.trig===0&&l.d>=100&&i<V.length-1))return null;
  const out=[];
  V.forEach((l,i)=>{
    const p=out[out.length-1],ult=i===V.length-1;
    if(p&&((l.idx!=null&&l.idx===p.idx)||(ult&&l.idx==null&&l.d<100))){
      if(l.hr!=null)p.hr=p.hr!=null?(p.hr*p.t+l.hr*l.t)/(p.t+l.t):l.hr;
      p.hm=Math.max(p.hm||0,l.hm||0)||null;p.d+=l.d;p.t+=l.t}
    else out.push({idx:l.idx,d:l.d,t:l.t,hr:l.hr,hm:l.hm});
  });
  return out.length>=2?out.map(e=>({idx:e.idx,d:Math.round(e.d),t:Math.round(e.t*10)/10,hr:e.hr!=null?Math.round(e.hr):null,hm:e.hm})):null;
}

const nomeCurto=e=>({'Aquecer':'Aquec.','Desaquecer':'Desaq.'}[e.nome]||e.nome)+(e.n?' '+e.r+'/'+e.n:'');
function nomearEtapas(E,a){

  if(fl.length===E.length)return fl;

  const rep=Object.keys(cnt).filter(k=>cnt[k]>=2),seq={};let rap=null;
  if(rep.length===2){const pa=k=>{const s=E.filter(e=>String(e.idx)===k);return s.reduce((x,e)=>x+e.t,0)/s.reduce((x,e)=>x+e.d,0)};rap=pa(rep[0])<pa(rep[1])?rep[0]:rep[1]}

// reconhece o ID (i + números) e a chave (texto longo) mesmo colados juntos, com "API_KEY:" ou com espaços
function parseConn(txt){
  const t=String(txt||'').replace(/API[_ ]?KEY\s*[:=]?/ig,' ');
  const id=(t.match(/\bi\d{3,10}\b/i)||[])[0],toks=(t.match(/[A-Za-z0-9]{20,}/g)||[]).sort((a,b)=>b.length-a.length);
  return {id:id?id.toLowerCase():null,key:toks[0]||null};
}
function connVals(){
  let id=($('#c-ath').value||'').trim().toLowerCase();if(/^\d{3,10}$/.test(id))id='i'+id;
  const raw=($('#c-key').value||'').trim(),key=parseConn(raw).key||raw.replace(/^API[_ ]?KEY\s*[:=]?/i,'').replace(/\s+/g,'');
  return {id,key,idOk:/^i\d{3,10}$/.test(id),keyOk:/^[A-Za-z0-9]{16,}$/.test(key),vazio:!id&&!raw};
}
window.connStatus=()=>{
  const v=connVals(),st=$('#c-st'),go=$('#c-go');if(!st||!go)return;
  const ok=v.idOk&&v.keyOk;go.disabled=!ok;
  st.innerHTML=v.vazio?'':ok?'<span class="ok">✓ ID e chave encontrados. Agora é só tocar no botão abaixo.</span>'
    :!v.id?'<span class="warn">Falta o ID do atleta (começa com i).</span>':!v.idOk?'<span class="warn">O ID começa com a letra i, como i123456.</span>'
    :!v.key?'<span class="warn">Falta a chave de API.</span>':'<span class="warn">A chave parece incompleta. Copie ela inteira.</span>';
};
// colou os dois no mesmo campo, ou colou a chave no campo do ID: arruma sozinho
window.connIn=()=>{
  const a=$('#c-ath'),k=$('#c-key'),p=parseConn(a.value);
  if(p.id&&p.key){a.value=p.id;k.value=p.key}else if(!p.id&&p.key&&!k.value.trim()){k.value=p.key;a.value=''}

};

const unitOf=s=>/km$/.test(s)?'km':/min$/.test(s)?'min':'m';
function zoneOf(r,Z){if(!r)return '';let b='E',bd=1e9;for(const k in Z){const d=Math.abs((Z[k][0]+Z[k][1]-r[0]-r[1])/2);if(d<bd){bd=d;b=k}}return b}
const stepKm=s=>{const v=parseFloat(s[1]),r=s[3]||1,u=unitOf(s[1]);if(u==='km')return v*r;if(u==='m')return v/1000*r;return v*60/(s[2]?(s[2][0]+s[2][1])/2:/Caminh/.test(s[0])?600:420)*r};

/* ================= MAPA (lugares para correr, locais e ranking) ================= */
// locais = agrupamento das corridas (de todos os atletas) pelo centro do trajeto; cada local tem ranking por distância
// os outros atletas vêm do servidor público (PUBURL); ninguém precisa adicionar ninguém
let CM=null,CP={i:0,d:0},PLC=[];
const CDIST=[[1000,'1 KM'],[3000,'3 KM'],[5000,'5 KM'],[10000,'10 KM'],[21097.5,'21 KM']];
const myPic=()=>LS.get('foto',null)||(D.athlete||{}).pic||'logo.png';
const dM=(p,q)=>Math.hypot((p[0]-q[0])*111320,(p[1]-q[1])*111320*Math.cos(p[0]*Math.PI/180));
const cen=tr=>{let a=0,b=0;for(const q of tr){a+=q[0];b+=q[1]}return [a/tr.length,b/tr.length]};
function bestsOf(a,b0){const b={...(b0||{})};for(const [d] of CDIST)if(a.dist>=d*0.99&&a.dist<=d*1.05&&a.mov){const t=Math.round(a.mov*d/a.dist);if(!b[d]||t<b[d])b[d]=t}return b}
function people(){
  const me={id:CFG.athlete,name:((D.athlete||{}).name||'Você'),pic:myPic(),me:1,
    runs:D.acts.filter(a=>isRun(a)&&AX[a.id]&&AX[a.id].map).map(a=>({id:a.id,date:a.date,dist:a.dist,mov:a.mov,best:bestsOf(a,AX[a.id].best),map:AX[a.id].map}))};
  return [me,...PUBL.filter(u=>u.id!==CFG.athlete&&u.runs&&u.runs.length).map(u=>({id:u.id,name:u.name||u.id,pic:u.pic||'logo.png',runs:u.runs}))];
}
function buildPlaces(P){
  const L=[];
  for(const u of P)for(const r of u.runs){const c=cen(r.map);let pl=L.find(l=>dM(l.c,c)<900);
    if(!pl){pl={c,runs:[]};L.push(pl)}pl.runs.push({u,r});const n=pl.runs.length;pl.c=[pl.c[0]+(c[0]-pl.c[0])/n,pl.c[1]+(c[1]-pl.c[1])/n]}
  L.sort((a,b)=>b.runs.length-a.runs.length);
  L.forEach((pl,i)=>{pl.i=i;pl.key=pl.c[0].toFixed(3)+','+pl.c[1].toFixed(3);pl.km=pl.runs.reduce((s,x)=>s+(x.r.dist||0),0)/1000;pl.users=[...new Set(pl.runs.map(x=>x.u.id))].length;
    pl.dists=CDIST.filter(([d])=>pl.runs.some(x=>x.r.best&&x.r.best[d]))});
  return L;
}
// ranking de um local numa distância: o melhor tempo de cada atleta
function board(pl,d){const B={};for(const {u,r} of pl.runs){const t=r.best&&r.best[d];if(t&&(!B[u.id]||t<B[u.id].t))B[u.id]={u,t,date:r.date,id:r.id}}return Object.values(B).sort((a,b)=>a.t-b.t)}
// pontos: 10 para o 1º, 6 para o 2º, 3 para o 3º em cada distância de cada local
function ranking(){const R={};for(const pl of PLC)for(const [d] of pl.dists)board(pl,d).forEach((x,i)=>{const o=R[x.u.id]=R[x.u.id]||{u:x.u,pts:0,coroas:0,locais:new Set()};o.pts+=[10,6,3][i]||1;if(!i)o.coroas++;o.locais.add(pl.i)});
  return Object.values(R).sort((a,b)=>b.pts-a.pts)}
// nome do local pelo OpenStreetMap (bairro ou rua), guardado no aparelho
const PN=LS.get('pn',{});let _pnq=Promise.resolve();
function placeName(pl){
  if(PN[pl.key])return Promise.resolve(PN[pl.key]);
  return _pnq=_pnq.then(async()=>{if(PN[pl.key])return PN[pl.key];
    try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=16&accept-language=pt-BR&lat=${pl.c[0].toFixed(4)}&lon=${pl.c[1].toFixed(4)}`).then(r=>r.json()),a=r.address||{};
      PN[pl.key]=a.park||a.leisure||a.neighbourhood||a.suburb||a.road||a.city_district||('Local '+(pl.i+1));LS.set('pn',PN)}catch(e){return 'Local '+(pl.i+1)}
    await new Promise(r=>setTimeout(r,1100));return PN[pl.key]});
}
// servidor público do Competitivo: cada app publica o resumo das próprias corridas e lê o de todos
const PUBURL='https://boonie-run.igordejesusp.workers.dev';
let PUBL=LS.get('pub',[]);
// tira 200 m do começo e do fim (para não mostrar onde a pessoa mora) e reduz a até 80 pontos
function trimTrack(tr){
  if(!tr||tr.length<6)return null;let a=0,d=0;while(a<tr.length-1&&d<200){d+=dM(tr[a],tr[a+1]);a++}
  let b=tr.length-1;d=0;while(b>a&&d<200){d+=dM(tr[b],tr[b-1]);b--}
  const t=tr.slice(a,b+1);if(t.length<3)return null;const st=Math.max(1,Math.ceil(t.length/80));
  return t.filter((_,i)=>i%st===0||i===t.length-1);
}
async function publishMine(force){
  if(LS.get('comp',null)!=='sim'||!CFG.key)return;
  const runs=D.acts.filter(a=>isRun(a)&&AX[a.id]&&AX[a.id].map).slice(0,150).map(a=>({id:a.id,date:a.date.slice(0,10),dist:Math.round(a.dist||0),mov:a.mov,best:bestsOf(a,AX[a.id].best),map:trimTrack(AX[a.id].map)})).filter(r=>r.map);
  const sig=runs.length+'|'+(runs[0]&&runs[0].id)+'|'+runs.reduce((s,r)=>s+r.dist,0);
  if(!force&&sig===LS.get('pubh',''))return;
  const r=await fetch(PUBURL+'/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({athlete:CFG.athlete,key:CFG.key,runs})});
  if(!r.ok)throw new Error('HTTP '+r.status);
  LS.set('pubh',sig);
}
async function pullAll(){
  const r=await fetch(PUBURL+'/all');if(!r.ok)throw new Error('HTTP '+r.status);
  PUBL=(await r.json()).filter(u=>u.id!==CFG.athlete);LS.set('pub',PUBL);LS.set('pubAt',Date.now());
}

    else if(s[3]){for(let r=1;r<=s[3];r++)out.push(mk(s,r,s[3]));i++}

function wkNext(manual){

    if(go){go.disabled=!ok;go.textContent=ok?'INICIAR':'GPS…'}
    if(fo)fo.style.display=ok?'none':'';
    if(gt&&gt.dataset.c!==cat){gt.dataset.c=cat;gt.innerHTML=cat==='ok'?'<span class="ok">✓ GPS pronto. Pode começar.</span>':cat==='busca'?'<span class="warn">Procurando o sinal de GPS. Fique em um lugar aberto…</span>':'<span class="warn">Sinal de GPS fraco. Espere ficar verde antes de começar.</span>'}}
  const want=idle?'i':st+(REC&&REC.wk?'w':'');
  if($('#r-ctl').dataset.st!==want){$('#r-ctl').dataset.st=want;
    $('#r-ctl').innerHTML=idle?`<button class="rbtn" id="r-go" onclick="recGo()" disabled>GPS…</button>`
      :st==='run'?`<button class="rbtn amb" onclick="recPause()">PAUSAR</button>${REC.wk?`<button class="rbtn" onclick="recSkip()">PULAR<br>ETAPA</button>`:''}`
      :`<button class="rbtn" onclick="recGo()">CONTINUAR</button><button class="rbtn red" onclick="recEnd()">FINALIZAR</button>`}
}
function recDraw(){
  if(!RM||!RM.getSource('rt'))return;
  const segs={};(REC?REC.pts:[]).forEach(q=>(segs[q[4]]=segs[q[4]]||[]).push([q[2],q[1]]));
  RM.getSource('rt').setData({type:'Feature',geometry:{type:'MultiLineString',coordinates:Object.values(segs).filter(s=>s.length>1)}});
  if(FIX){const c=[FIX.ll[1],FIX.ll[0]];RM.getSource('me').setData({type:'Feature',geometry:{type:'Point',coordinates:c}});
    if(!RM._fixou){RM.jumpTo({center:c,zoom:16});RM._fixou=1}else if(recLive())RM.easeTo({center:c,duration:600})}
}
window.openRec=d=>{
  if(!CFG.key)return toast('CONECTE O INTERVALS EM MAIS');
  if(typeof d!=='string')d=null; // o botão vermelho chama sem data
  const el=$('#rec');
  if(!recLive()){const p=planOn(d||ymd(TODAY()));RSEL={p,modo:p&&status(p)!=='cumprido'?'treino':'livre'}}
  if(!el.innerHTML){
    el.innerHTML=`<div class="rtop"><button class="b sm" id="r-min" onclick="closeRec()" aria-label="Fechar">✕</button><div style="text-align:center"><b style="font-size:12px;letter-spacing:.14em;color:var(--amber)">GRAVAR CORRIDA</b><div class="meta" id="r-gps"></div></div><button class="b sm" id="r-voz" onclick="togVoz()" aria-label="Voz"></button></div>
    <div id="rmap"><span class="chip" id="r-st" style="position:absolute;z-index:2;left:10px;top:10px;color:var(--red);border-color:var(--red)"></span><div class="ral" id="r-al" style="display:none"></div></div>
    <div id="r-pre"></div>
    <div class="rmet" id="r-run" style="display:none"><div class="meta" style="text-align:center;min-height:14px">${GUIA!=null?'Rota: '+esc(ROTAS[GUIA].nome)+' · '+(ROTAS[GUIA].dist/1000).toFixed(1).replace('.',',')+' km':''}</div><div id="r-wk"></div><div class="rbig" id="r-t">0:00</div><div class="lbl" style="text-align:center;margin-top:3px">TEMPO EM MOVIMENTO</div>
    <div class="grid g2" style="margin-top:12px"><div class="cell"><div class="lbl">Distância</div><span class="num big" id="r-d"></span></div><div class="cell"><div class="lbl">Ritmo atual</div><span class="num big" id="r-pa"></span></div><div class="cell"><div class="lbl">Ritmo médio</div><span class="num" id="r-pm"></span></div><div class="cell"><div class="lbl">Km atual</div><span class="num" id="r-pk"></span></div></div></div>
    <div class="rctl" id="r-ctl"></div>`}
  prePaint();
  $('#r-voz').textContent=LS.get('voz',1)?'🔊':'🔇';
  el.classList.add('on');$('#recfab').classList.remove('on');recWatch(1);
  clearInterval(RTK);RTK=setInterval(recUI,1000);recUI();
  mlLoad().then(st=>{
    if(RM){RM.resize();recDraw();return}
    RM=new maplibregl.Map({container:'rmap',style:structuredClone(st),center:FIX?[FIX.ll[1],FIX.ll[0]]:[-48.277,-18.918],zoom:FIX?16:12,dragRotate:false,pitchWithRotate:false,attributionControl:{compact:true,customAttribution:'OpenFreeMap'}});
    RM.on('load',()=>{
      RM.addSource('rt',{type:'geojson',data:{type:'Feature',geometry:{type:'MultiLineString',coordinates:[]}}});RM.addSource('me',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
      RM.addLayer({id:'rt0',type:'line',source:'rt',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':TM[TEMA()].sob,'line-opacity':.6,'line-width':8}});
      RM.addLayer({id:'rt1',type:'line',source:'rt',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#4a9eff','line-width':4.5}});
      if(GUIA!=null){const g=ROTAS[GUIA];RM.addSource('guia',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:g.c.map(q=>[q[1],q[0]])}}});
        RM.addLayer({id:'guia',type:'line',source:'guia',paint:{'line-color':TEMA()==='light'?'#6f7c89':'#9aa3ad','line-width':4,'line-dasharray':[2,1.6],'line-opacity':.9}},'rt0');
        if(!FIX){const b=g.c.reduce((b,q)=>b.extend([q[1],q[0]]),new maplibregl.LngLatBounds([g.c[0][1],g.c[0][0]],[g.c[0][1],g.c[0][0]]));RM.fitBounds(b,{padding:40,animate:false})}}
      RM.addLayer({id:'me0',type:'circle',source:'me',paint:{'circle-radius':18,'circle-color':'#4a9eff','circle-opacity':.2}});
      RM.addLayer({id:'me',type:'circle',source:'me',paint:{'circle-radius':7,'circle-color':'#fff','circle-stroke-color':'#4a9eff','circle-stroke-width':3}});
      recDraw()});
  }).catch(()=>{});
};
window.closeRec=()=>{$('#rec').classList.remove('on');if(!recLive()){recWatch(0);clearInterval(RTK);RTK=null}render()};
window.togVoz=()=>{LS.set('voz',LS.get('voz',1)?0:1);$('#r-voz').textContent=LS.get('voz',1)?'🔊':'🔇'};
window.recGo=force=>{
  if(!REC||REC.st==='idle'){
    if(force!==1&&!(FIX&&FIX.acc<=30&&Date.now()-FIX.t<8000))return toast('AGUARDE O GPS FICAR VERDE');
    const p=RSEL.modo==='treino'?RSEL.p:null;
    REC={st:'run',seg:0,pts:[],dist:0,mov:0,since:Date.now(),splits:[],t0:Date.now(),g:gNovo(),wk:p?{t:p.titulo,steps:flatSteps(p),i:0,d0:0,t0:0,laps:[]}:null};
    if(REC.wk&&!REC.wk.steps.length)REC.wk=null;
    say('Gravação iniciada. Bom treino.');if(REC.wk)setTimeout(wkSay,2200);
  }
  else if(REC.st==='pause'){REC.st='run';REC.since=Date.now();REC.seg++;say('Continuando.')}
  recKeep();wake(1);recUI();
};
window.recPause=()=>{if(!REC||REC.st!=='run')return;REC.mov+=Date.now()-REC.since;REC.st='pause';recKeep();say('Pausado.');recUI()};
function recStats(){const P=REC.pts,t0=P.length?P[0][0]:REC.t0,t=[],d=[];let c=0;P.forEach((q,i)=>{if(i&&P[i-1][4]===q[4])c+=hav([P[i-1][1],P[i-1][2]],[q[1],q[2]]);t.push((q[0]-t0)/1000);d.push(c)});return {t0,t,d}}
window.recEnd=()=>{
  if(REC.st==='run')recPause();
  if(REC.dist<50&&!confirm('A corrida tem menos de 50 m. Finalizar mesmo assim?'))return;
  const mv=recMov(),w=REC.wk,g=REC.g||{},laps=w?[...w.laps]:[];
  if(w&&w.i<w.steps.length){const e=w.steps[w.i],dd=REC.dist-w.d0,tt=mv-w.t0;if(dd>20||tt>10)laps.push({nome:e.nome,r:e.r,n:e.n,dist:Math.round(dd),t:Math.round(tt),parcial:1})}
  const ruim=!!(g.ocN||g.max>=20||g.fraco>Math.max(10,(g.ok||0)*.3));
  const itens=[(g.ok||0)+' pontos válidos'];
  if(g.fraco)itens.push(g.fraco+' descartados por sinal fraco');if(g.salto)itens.push(g.salto+' por salto de posição');
  if(g.max>=10)itens.push('maior tempo sem sinal: '+g.max+' s');if(g.ocN)itens.push('app fora da tela '+g.ocN+'× ('+fmtT(g.ocMs/1000)+')');
  openSheet(`<div class="hd"><b>CORRIDA FINALIZADA</b><button class="b sm" onclick="closeSheet()">✕</button></div>
  <div class="grid g3"><div class="cell"><div class="lbl">Distância</div><span class="num">${km(REC.dist)}<small> km</small></span></div><div class="cell"><div class="lbl">Tempo</div><span class="num">${fmtT(mv)}</span></div><div class="cell"><div class="lbl">Ritmo</div><span class="num">${REC.dist>50?fmtP(mv/REC.dist*1000):'--'}</span></div></div>
  ${w?`<div class="sec">TREINO<small>${w.laps.length} DE ${w.steps.length} ETAPAS</small></div><table><tr><th>Etapa</th><th class="r">Dist.</th><th class="r">Tempo</th><th class="r">Ritmo</th></tr>${laps.map(l=>`<tr><td style="font-family:var(--f)">${esc(nomeE(l))}${l.n?' '+l.r+'/'+l.n:''}${l.parcial?' (parcial)':''}</td><td class="r">${l.dist>=1000?kmTxt((l.dist/1000).toFixed(2)):l.dist+' m'}</td><td class="r">${fmtT(l.t)}</td><td class="r">${l.dist>50?fmtP(l.t/l.dist*1000):'--'}</td></tr>`).join('')}</table>`:''}
  ${REC.splits.length?`<div class="sec">PARCIAIS</div><table><tr><th>KM</th><th class="r">Ritmo</th></tr>${REC.splits.map((s,i)=>`<tr><td>${i+1}</td><td class="r">${fmtP(s)}</td></tr>`).join('')}</table>`:''}
  <div class="card ${ruim?'alert':''}" style="margin-top:12px"><div class="lbl ${ruim?'bad':''}">QUALIDADE DO GPS</div><p class="empty" style="margin-top:4px">${itens.join(' · ')}.</p>${ruim?'<p class="empty" style="margin-top:6px;color:var(--txt)">O GPS falhou em parte da corrida, então a distância pode estar menor que a real. Nas próximas, deixe a tela ligada e não troque de app.</p>':''}</div>
  <label class="f">Nome da corrida</label><input id="r-nome" value="${esc(w?w.t:'Corrida')}">
  <button class="b pri full" style="margin-top:14px" onclick="recSave()">Salvar</button>
  <div class="grid g2" style="margin-top:8px"><button class="b" onclick="closeSheet()">Voltar a gravar</button><button class="b red" onclick="recTrash()">Descartar</button></div>`);
};
window.recTrash=()=>{if(!confirm('Descartar esta corrida? Ela não poderá ser recuperada.'))return;recClear();closeSheet();toast('CORRIDA DESCARTADA')};
function recClear(){REC=null;GUIA=null;LS.set('rec',null);wake(0);recWatch(0);clearInterval(RTK);RTK=null;$('#rec').classList.remove('on');$('#rec').innerHTML='';if(RM){RM.remove();RM=null}render()}
function toGpx(name){
  let s=`<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Boonie Run" xmlns="http://www.topografix.com/GPX/1/1"><metadata><time>${new Date(REC.pts[0][0]).toISOString()}</time></metadata><trk><name>${esc(name)}</name><type>running</type>`,seg=null;
  for(const q of REC.pts){if(q[4]!==seg){if(seg!==null)s+='</trkseg>';s+='<trkseg>';seg=q[4]}s+=`<trkpt lat="${q[1]}" lon="${q[2]}">${q[3]!=null?`<ele>${q[3]}</ele>`:''}<time>${new Date(q[0]).toISOString()}</time></trkpt>`}
  return s+'</trkseg></trk></gpx>';
}
async function upGpx(name,gpx){
  const fd=new FormData();fd.append('file',new Blob([gpx],{type:'application/gpx+xml'}),'boonie-run.gpx');
  const r=await fetch(`${API}/athlete/${CFG.athlete}/activities?name=${encodeURIComponent(name)}`,{method:'POST',headers:{Authorization:'Basic '+btoa('API_KEY:'+CFG.key)},body:fd});
  if(!r.ok)throw new Error('HTTP '+r.status);
}
window.recSave=async()=>{
  if(!REC.pts.length)return toast('SEM PONTOS DE GPS PARA SALVAR');
  const name=$('#r-nome').value.trim()||'Corrida',gpx=toGpx(name),btn=document.querySelector('#sbox .b.pri');btn.disabled=true;btn.textContent='Enviando…';
  try{await upGpx(name,gpx);toast('CORRIDA SALVA NO INTERVALS',3000);closeSheet();recClear();setTimeout(()=>sync(0),5000)}
  catch(e){ // sem internet ou o Intervals recusou: guarda no celular e deixa reenviar depois
    const {t0,t,d}=recStats(),id='man-'+Date.now();
    AX[id]=analyze(t,d,[],[],{data:REC.pts.map(q=>q[1]),data2:REC.pts.map(q=>q[2])});LS.set('ax5',AX);LS.set('gpx.'+id,gpx);
    MAN.push({id,date:isoLocal(t0),type:'Run',name,dist:Math.round(REC.dist),mov:Math.round(recMov()),el:Math.round(t[t.length-1]||0),src:'APP',gpx:1});LS.set('man',MAN);
    D.acts=withMan(D.acts);LS.set('data',D);closeSheet();recClear();toast('SALVA NESTE CELULAR // REENVIE PELO DETALHE DA CORRIDA',4500)}
};
window.resendGpx=async id=>{
  const a=MAN.find(m=>m.id===id),gpx=LS.get('gpx.'+id,null);if(!a||!gpx)return;
  try{await upGpx(a.name,gpx);MAN=MAN.filter(m=>m.id!==id);LS.set('man',MAN);LS.set('gpx.'+id,null);D.acts=withMan(D.acts);LS.set('data',D);closeSheet();toast('ENVIADA AO INTERVALS',3000);setTimeout(()=>sync(0),5000)}
  catch(e){toast('AINDA NÃO DEU // '+e.message,3500)}
};
if(recLive()){recWatch(1);RTK=setInterval(recUI,1000);
  const g=REC.g;if(g.hid){const ms=Date.now()-g.hid;g.hid=0;if(ms>3000){g.ocN++;g.ocMs+=ms;g.ult=ms;g.avisa=Date.now()+25000}recKeep()}}

/* ================= tema claro (gelo) e escuro ================= */
const SOL='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
const LUA='<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function temaIcone(){const l=TEMA()==='light';$('#tema').innerHTML=l?LUA:SOL;$('#tema').setAttribute('aria-label',l?'Modo escuro':'Modo claro');
  document.querySelector('meta[name=theme-color]').content=l?'#1d2733':'#000000'}
window.togTema=()=>{
  const l=TEMA()!=='light';if(l)document.documentElement.dataset.theme='light';else delete document.documentElement.dataset.theme;LS.set('tema',l?'light':'dark');temaIcone();
  // os mapas são refeitos com a paleta nova
  if(CM){CM.remove();CM=null;const c=$('#cmap');if(c)c.parentNode.innerHTML=''}
  if(RM){RM.remove();RM=null;$('#rec').innerHTML='';if($('#rec').classList.contains('on'))openRec()}
  render();
};
temaIcone();

/* ================= navegação ================= */
const TITLES={ini:'INÍCIO',cal:'CALENDÁRIO',des:'DESAFIOS',comp:'MAPA',mais:'MAIS',perf:'PERFIL'};
let VIEW='ini';
function go2(v){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
function go(v){VIEW=v;go2(v);render()}
document.querySelectorAll('#tabbar button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#av').onclick=()=>go(VIEW==='perf'?'ini':'perf');
$('#sync').onclick=()=>sync(0);
// junta cada título de seção (.sec) com o conteúdo dele num bloco, para as colunas não cortarem uma seção ao meio
function groupBlocks(el){const K=[...el.children];if(!K.length||K[0].classList.contains('blk'))return;let b=null;
  for(const k of K){if(!b||k.classList.contains('sec')){b=document.createElement('div');b.className='blk';el.insertBefore(b,k)}b.appendChild(k)}}
function render(){
  const ob=needOB();document.body.classList.toggle('ob',ob);
  const fab=$('#recfab');fab.classList.toggle('on',!ob&&!!CFG.key&&(VIEW==='ini'||recLive())&&!$('#rec').classList.contains('on'));fab.classList.toggle('live',recLive());
  if(ob){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-ini'));$('#ttl').textContent='BOAS-VINDAS';rOB();return}
  if(VIEW==='ini'||!$('#v-'+VIEW).classList.contains('on'))go2(VIEW);
  $('#ttl').textContent=TITLES[VIEW];
  $('#avimg').src=myPic();
  $('#avst').className=D.at&&Date.now()-D.at<864e5?'on':D.at?'off':'';
  ({ini:rIni,cal:rCal,des:rDes,comp:rComp,mais:rMais,perf:rPerf})[VIEW]();
  if(['ini','des','mais','perf'].includes(VIEW))groupBlocks($('#'+VIEW));
  drawMaps();
}
window.sync=sync;window.sendWatch=sendWatch;
render();
if(CFG.key&&(!D.at||Date.now()-D.at>30*60e3))sync(0);
</script>
</body>
</html>
