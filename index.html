<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Boonie Run</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#000;--panel:#0d0d0d;--line:#252a31;--blue:#4a9eff;--amber:#c9a24a;--red:#e0442f;--ok:#7cc4ff;--cy:#f2f4ee;--txt:#f2f4ee;--dim:#8a929e;--f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Inter,Arial,sans-serif;--m:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--f);font-variant-numeric:tabular-nums;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#top{position:absolute;top:0;left:0;right:0;z-index:9;background:linear-gradient(var(--panel),#080808);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:10px}
#top .brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
#top .brand img{height:34px;mix-blend-mode:screen}
#top .brand b{color:#fff;letter-spacing:.16em;font-size:14px;white-space:nowrap}
#top .brand small{color:var(--dim);letter-spacing:.1em;font-size:9px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#av{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--blue);padding:2px;background:none;flex:none}
#av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#111}
#av i{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--dim);border:2px solid #000}
#av i.on{background:var(--ok)}#av i.off{background:var(--red)}
.view{position:absolute;left:0;right:0;top:calc(57px + env(safe-area-inset-top));bottom:calc(60px + env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px max(12px,env(safe-area-inset-left)) 28px;display:none}
.view.on{display:block}
.wrap{max-width:480px;margin:0 auto}
#tabbar{position:absolute;left:0;right:0;bottom:0;z-index:9;height:calc(60px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#000;border-top:1px solid var(--line);display:flex}
#tabbar button{flex:1;min-width:0;background:none;border:0;color:var(--dim);font-size:9.5px;letter-spacing:.08em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
#tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
#tabbar button.on{color:var(--blue);box-shadow:inset 0 2px var(--blue)}
.sec{margin:20px 0 8px;padding-bottom:6px;color:var(--amber);letter-spacing:.14em;font-size:11px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;min-height:34px}
.sec span{display:flex;align-items:center}
.q{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#070707;color:var(--dim);font-size:12px;margin-left:8px;padding:0;line-height:1;font-family:var(--m)}
.help p{font-size:13px;line-height:1.6;color:var(--txt);margin-bottom:10px}.help b{color:var(--blue);font-weight:600}
details.card summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:30px;font-size:13px;color:#fff;cursor:pointer}
details.card summary::-webkit-details-marker{display:none}
details.card summary:after{content:'▾';color:var(--dim);margin-left:auto;transition:transform .2s}
details[open].card summary:after{transform:rotate(180deg)}
.more{display:block;width:100%;margin-top:8px}
.sec:first-child{margin-top:4px}
.sec small{color:var(--dim);letter-spacing:.08em;font-size:10px}
.card{border:1px solid var(--line);background:var(--panel);padding:12px;margin-bottom:10px;border-radius:8px;position:relative}
.card.cur{border-color:var(--blue);box-shadow:inset 3px 0 var(--blue)}
.card.alert{border-color:var(--red);box-shadow:inset 3px 0 var(--red)}
.card h2{font-size:15px;color:#fff;margin-bottom:2px}
.meta{color:var(--dim);font-size:11px;letter-spacing:.04em}
.lbl{color:var(--dim);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.num{font-family:var(--m);color:#fff;font-weight:600}
.big{font-size:26px;line-height:1.1}
.grid{display:grid;gap:8px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}
.cell{border:1px solid var(--line);background:#070707;padding:8px;border-radius:6px;min-width:0;position:relative}
.cell.tap{text-align:left;color:inherit;font:inherit;width:100%;display:block}
.cell.tap:after{content:'›';position:absolute;right:8px;top:5px;color:var(--blue);font-size:16px}
.cell.tap:active{background:#0a1828}
.cell .num{font-size:17px;display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .num small{font-size:11px;color:var(--dim);font-weight:400}
.ok{color:var(--ok)!important}.warn{color:var(--amber)!important}.bad{color:#ff7a66!important}.dim{color:var(--dim)!important}
.b{min-height:44px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);color:#fff;border-radius:6px;letter-spacing:.1em;font-size:11px;text-transform:uppercase}
.b.pri{background:#0a1828;border-color:var(--blue);color:var(--blue)}
.b.red{color:#ff7a66;border-color:var(--red);background:#1a0805}
.b.sm{padding:0 12px;min-height:38px;min-width:40px;font-size:10px}
.b.full{width:100%}
.b:disabled{opacity:.4}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.coach{margin-top:10px;border-top:1px dashed var(--line);padding-top:9px;font-size:12px;line-height:1.55;color:var(--txt)}
.coach b{color:var(--blue);letter-spacing:.12em;font-size:10px;display:block;margin-bottom:3px}
.bar{height:6px;background:#12161c;border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue)}
.bar.red i{background:var(--red)}
.steps{margin-top:8px;font-family:var(--m);font-size:12px}
.steps div{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid #15181d}
.steps div span:first-child{color:var(--dim);width:88px;flex:none;font-family:var(--f);font-size:11px;letter-spacing:.04em}
.tag{display:inline-block;font-size:9px;letter-spacing:.12em;padding:2px 6px;border:1px solid var(--line);border-radius:3px;color:var(--dim);text-transform:uppercase}
.tag.ok{border-color:var(--blue);color:var(--blue)}.tag.bad{border-color:var(--red);color:#ff7a66}.tag.warn{border-color:var(--amber);color:var(--amber)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--dim);font-weight:400;font-size:10px;letter-spacing:.1em;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;border-bottom:1px solid #15181d;font-family:var(--m)}
td.r,th.r{text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;background:none;border:0;padding:0 14px;min-height:38px;color:var(--dim);font-size:10px;letter-spacing:.12em}
.seg button.on{background:#0a1828;color:var(--blue)}
.wk{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.wk b{font-size:12px;letter-spacing:.1em}
.day{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 10px;margin-bottom:6px}
.day.today{border-color:var(--blue)}
.day .d{text-align:center}
.day .d b{display:block;font-size:18px;font-family:var(--m);color:#fff}
.day .d span{font-size:9px;letter-spacing:.12em;color:var(--dim)}
.day .pl{font-size:12px;color:var(--txt);line-height:1.4}
.day .ex{font-size:12px;font-family:var(--m);color:var(--ok);margin-top:2px}
.day .vt{font-size:10px;color:var(--dim);text-align:right;font-family:var(--m);line-height:1.5}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mgrid .h{font-size:9px;color:var(--dim);letter-spacing:.1em;text-align:center;padding:4px 0}
.mc{aspect-ratio:1/1.15;border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:4px;font-size:10px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.mc.out{opacity:.25}.mc.today{border-color:var(--blue)}
.mc .n{color:var(--dim);font-family:var(--m)}
.mc .k{font-family:var(--m);color:#fff;font-size:11px}
.mc .k.p{color:var(--dim)}
.mc .dot{width:7px;height:7px;border-radius:50%;border:1px solid var(--blue)}
.mc .dot.f{background:var(--blue)}.mc .dot.x{border-color:var(--red);background:var(--red)}
.list .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #15181d}
.list .it .ic{width:34px;height:34px;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:.06em;color:var(--blue);flex:none}
.list .it .t{flex:1;min-width:0}
.list .it .t b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .it .v{font-family:var(--m);font-size:12px;text-align:right}
.badge{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;padding:10px 4px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.badge .hx{width:44px;height:44px}
.badge b{font-size:10px;letter-spacing:.08em}
.badge small{font-size:9px;color:var(--dim)}
.badge.lock{opacity:.35}
#sheet{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.75);display:none}
#sheet.on{display:block}
#sheet .box{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - 40px - env(safe-area-inset-top));overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:#050505;border-top:1px solid var(--blue);border-radius:14px 14px 0 0;padding:22px 12px calc(24px + env(safe-area-inset-bottom))}
#sheet .box:before{content:"";position:absolute;top:8px;left:calc(50% - 18px);width:36px;height:4px;border-radius:2px;background:var(--line)}
#sheet .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
#sheet .hd b{color:var(--amber);letter-spacing:.14em;font-size:12px}
label.f{display:block;color:var(--dim);font-size:10px;letter-spacing:.1em;margin:10px 0 4px;text-transform:uppercase}
input,select{width:100%;background:#000;border:1px solid var(--line);padding:10px;border-radius:6px;-webkit-user-select:text;user-select:text;font-size:16px}
svg.ch{width:100%;display:block}
#toast{position:absolute;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);z-index:30;background:#0d0d0d;border:1px solid var(--blue);color:var(--blue);padding:9px 14px;border-radius:6px;font-size:11px;letter-spacing:.1em;display:none;max-width:90%;text-align:center}
#toast.on{display:block}
.empty{color:var(--dim);font-size:12px;line-height:1.5}
.ring{display:flex;align-items:center;gap:14px}
.ring svg{width:86px;height:86px;flex:none}
.feel{display:flex;gap:6px}
.feel button{flex:1;min-height:44px;background:#070707;border:1px solid var(--line);border-radius:6px;font-family:var(--m);color:var(--dim)}
.feel button.on{border-color:var(--blue);color:var(--blue);background:#0a1828}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

</style>
</head>
<body>
<header id="top">
  <div class="brand"><img src="logo.png" alt=""><div><b id="ttl">INÍCIO</b><small>BOONIE RUN</small></div></div>
  <button id="sync" class="b sm" title="Sincronizar">SYNC</button>
  <button id="av" aria-label="Perfil"><img id="avimg" src="logo.png" alt=""><i id="avst"></i></button>
</header>

<main>
  <section class="view on" id="v-ini"><div class="wrap" id="ini"></div></section>
  <section class="view" id="v-cal"><div class="wrap" id="cal"></div></section>
  <section class="view" id="v-des"><div class="wrap" id="des"></div></section>
  <section class="view" id="v-mais"><div class="wrap" id="mais"></div></section>
  <section class="view" id="v-perf"><div class="wrap" id="perf"></div></section>
</main>

<nav id="tabbar">
  <button data-v="ini" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg>INÍCIO</button>
  <button data-v="cal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>CALENDÁRIO</button>
  <button data-v="des"><svg viewBox="0 0 24 24"><path d="M6 3v18M6 4h11l-2 4 2 4H6"/></svg>DESAFIOS</button>
  <button data-v="mais"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>MAIS</button>
</nav>

<div id="sheet"><div class="box" id="sbox"></div></div>
<div id="toast"></div>

<script src="config.local.js" onerror="void 0"></script>
<script>
'use strict';
/* ================= util ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem('br.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('br.'+k,JSON.stringify(v))}catch(e){}}};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const [y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=(x.getDay()+6)%7;return addD(x,-w)};
const TODAY=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const DOW=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const MES=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
const fmtT=s=>{if(s==null||!isFinite(s))return '--';s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+':'+pad(m)+':'+pad(x):m+':'+pad(x)};
const fmtP=spk=>{if(!spk||!isFinite(spk)||spk>1200)return '--';spk=Math.round(spk);return Math.floor(spk/60)+':'+pad(spk%60)};
const km=m=>m==null?'--':(m/1000).toFixed(m>=10000?1:2);
const fmtSleep=s=>s?Math.floor(s/3600)+'h'+pad(Math.round(s%3600/60)):'--';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function toast(t,ms=2400){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('on'),ms)}
const isRun=a=>/Run/.test(a.type||'');

/* ================= config ================= */
const CFG=Object.assign({athlete:'',key:'',fcmax:194,fcrep:52,limiar:300,longDay:0},window.LOCAL_CFG||{},LS.get('cfg',{}));
function saveCfg(){LS.set('cfg',CFG)}

/* ================= Intervals.icu ================= */
const API='https://intervals.icu/api/v1';
async function api(path,opt={}){
  if(!CFG.athlete||!CFG.key)throw new Error('SEM CHAVE');
  const r=await fetch(API+path,{...opt,headers:{Authorization:'Basic '+btoa('API_KEY:'+CFG.key),'Content-Type':'application/json',...(opt.headers||{})}});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const t=await r.text();return t?JSON.parse(t):null;
}
let D=LS.get('data',{athlete:null,acts:[],well:[],at:0});
let AX=LS.get('ax4',{}); // análise por atividade: splits, best efforts, deriva
const slim=a=>({id:a.id,date:a.start_date_local,type:a.type,name:a.name,dist:a.distance,mov:a.moving_time,el:a.elapsed_time,hr:a.average_heartrate,hrmax:a.max_heartrate,load:a.icu_training_load,trimp:a.trimp,elev:a.total_elevation_gain,cad:a.average_cadence,rpe:a.icu_rpe,feel:a.feel,speed:a.average_speed,src:a.source});

async function sync(full){
  const btn=$('#sync');btn.disabled=true;btn.textContent='...';
  try{
    const t=TODAY(),old=ymd(addD(t,-400)),nw=ymd(addD(t,1));
    const [ath,acts,well,evs]=await Promise.all([api('/athlete/'+CFG.athlete),api(`/athlete/${CFG.athlete}/activities?oldest=${old}&newest=${nw}`),api(`/athlete/${CFG.athlete}/wellness?oldest=${old}&newest=${nw}`),api(`/athlete/${CFG.athlete}/events?oldest=${ymd(addD(t,-60))}&newest=${ymd(addD(t,120))}&category=WORKOUT`)]);
    D={athlete:{name:ath.name,pic:ath.profile_medium,rhr:ath.icu_resting_hr,weight:ath.icu_weight,city:ath.city,
        gAct:ath.icu_garmin_sync_activities,gWell:ath.icu_garmin_download_wellness,gUp:ath.icu_garmin_upload_workouts,
        run:(ath.sportSettings||[]).find(s=>(s.types||[]).includes('Run'))||null},
      acts:(acts||[]).filter(a=>a.type).map(slim).sort((a,b)=>a.date<b.date?1:-1),
      well:(well||[]).map(w=>({d:w.id,rhr:w.restingHR,sleep:w.sleepSecs,ss:w.sleepScore,hrv:w.hrv,vo2:w.vo2max,steps:w.steps,feel:w.fatigue})),
      ev:(evs||[]).filter(e=>e.category==='WORKOUT').map(e=>({id:e.id,d:e.start_date_local.slice(0,10),name:e.name})),
      at:Date.now()};
    LS.set('data',D);
    await analyzeRuns(full);
    toast('SINCRONIZADO // '+D.acts.length+' ATIVIDADES');
  }catch(e){toast(e.message==='SEM CHAVE'?'CONFIGURE A CHAVE EM MAIS':'FALHA NA SINCRONIZAÇÃO // '+e.message,3500)}
  btn.disabled=false;btn.textContent='SYNC';render();
}

/* streams → parciais por km, melhores esforços, deriva cardíaca */
const BE=[[1000,'1 KM'],[3000,'3 KM'],[5000,'5 KM'],[10000,'10 KM'],[21097.5,'21 KM'],[30000,'30 KM'],[42195,'42 KM']];
async function analyzeRuns(full){
  const runs=D.acts.filter(isRun).filter(a=>full||!AX[a.id]).slice(0,60);
  for(const a of runs){
    try{
      const s=await api(`/activity/${a.id}/streams?types=time,distance,heartrate,velocity_smooth,altitude`);
      const g=k=>(s.find(x=>x.type===k)||{}).data||[];
      AX[a.id]=analyze(g('time'),g('distance'),g('heartrate'),g('altitude'));
    }catch(e){AX[a.id]={err:1}}
  }
  LS.set('ax4',AX);
}
function analyze(t,d,hr,alt){
  const out={splits:[],best:{},dec:null,chart:null};
  if(!t.length||!d.length)return out;
  // saltos de GPS: trecho acima de 6,5 m/s (2:34/km) não conta distância
  const c=[d[0]||0];for(let i=1;i<d.length;i++){const dd=(d[i]||0)-(d[i-1]||0),dt=(t[i]-t[i-1])||1;c.push(c[i-1]+(dd>0&&dd/dt<=6.5?dd:0))}
  d=c;
  // pausas: intervalo acima de 30 s vira o tempo que levaria no ritmo anterior
  const tm=[0];for(let i=1;i<t.length;i++){const dt=t[i]-t[i-1],dd=d[i]-d[i-1];let e=dt;if(dt>30){const pt=i>1?t[i-1]-t[i-2]:0,v=pt>0&&pt<=30?(d[i-1]-d[i-2])/pt:3;e=dd>0?dd/clamp(v,1.5,6):0}tm.push(tm[i-1]+e)}
  t=tm;
  // parciais por km
  let k=1,i0=0,t0=t[0];
  for(let i=1;i<d.length;i++){
    if(d[i]>=k*1000){
      const f=(k*1000-d[i-1])/((d[i]-d[i-1])||1),tk=t[i-1]+f*(t[i]-t[i-1]);
      const h=hr.slice(i0,i+1).filter(Boolean),hv=h.length?Math.round(h.reduce((x,y)=>x+y,0)/h.length):null;
      const el=alt.length?Math.round(alt[i]-alt[i0]):null;
      out.splits.push({km:k,t:tk-t0,hr:hv,el});t0=tk;i0=i;k++;
    }
  }
  const rest=d[d.length-1]-(k-1)*1000;
  if(rest>100){const h=hr.slice(i0).filter(Boolean);out.splits.push({km:k-1+rest/1000,part:rest,t:t[t.length-1]-t0,hr:h.length?Math.round(h.reduce((x,y)=>x+y,0)/h.length):null,el:alt.length?Math.round(alt[alt.length-1]-alt[i0]):null})}
  // melhores esforços (janela deslizante)
  for(const [dist] of BE){
    if(d[d.length-1]<dist)continue;
    let j=0,best=Infinity;
    for(let i=0;i<d.length;i++){
      while(j<d.length&&d[j]-d[i]<dist)j++;
      if(j>=d.length)break;
      const f=(dist-(d[j-1]-d[i]))/((d[j]-d[j-1])||1),tt=(t[j-1]+f*(t[j]-t[j-1]))-t[i];
      if(tt>0&&tt<best)best=tt;
    }
    if(isFinite(best))out.best[dist]=Math.round(best);
  }
  // deriva cardíaca (ritmo/FC 1ª metade vs 2ª)
  if(hr.length===t.length){
    const mv=[];for(let i=1;i<t.length;i++){const dt=t[i]-t[i-1],dd=d[i]-d[i-1];if(dt>0&&dt<=10&&dd/dt>1.6&&hr[i])mv.push([dt,dd,hr[i]])}
    const tot=mv.reduce((s,x)=>s+x[0],0);
    if(tot>1200){let acc=0,h1=[0,0,0],h2=[0,0,0];for(const x of mv){const h=(acc+=x[0])<=tot/2?h1:h2;h[0]+=x[0];h[1]+=x[1];h[2]+=x[2]*x[0]}
      const e1=(h1[1]/h1[0])/(h1[2]/h1[0]),e2=(h2[1]/h2[0])/(h2[2]/h2[0]),dec=Math.round((e1-e2)/e1*1000)/10;if(Math.abs(dec)<=30)out.dec=dec}
  }
  // gráfico reduzido (até 120 pontos)
  const n=Math.max(1,Math.floor(t.length/120));const P=[],H=[];
  for(let i=n;i<t.length;i+=n){const dd=d[i]-d[i-n],tt=t[i]-t[i-n];P.push(dd>0?tt/dd*1000:null);H.push(hr[i]||null)}
  out.chart={p:P,h:H};
  return out;
}

/* ================= motor analítico ================= */
// carga do dia: HRSS do Intervals; sem ele, TRIMP de Banister pela FC média
function loadOf(a){
  if(a.load!=null)return a.load;
  if(a.hr&&a.mov){const r=clamp((a.hr-CFG.fcrep)/(CFG.fcmax-CFG.fcrep),0,1);return a.mov/60*r*0.64*Math.exp(1.92*r)}
  return 0;
}
function pmc(){ // CTL 42 d, ATL 7 d (EWMA), TSB = CTL − ATL do dia anterior
  const byDay={};for(const a of D.acts){const k=a.date.slice(0,10);byDay[k]=(byDay[k]||0)+loadOf(a)}
  const t=TODAY();let d=addD(t,-400),ctl=0,atl=0;const S=[];
  while(d<=t){const L=byDay[ymd(d)]||0;const tsb=ctl-atl;ctl+=(L-ctl)/42;atl+=(L-atl)/7;S.push({d:ymd(d),L,ctl,atl,tsb});d=addD(d,1)}
  return S;
}
// VDOT (Daniels & Gilbert)
function vdot(dist,sec){const m=sec/60,v=dist/m;const vo2=-4.6+0.182258*v+0.000104*v*v;const p=0.8+0.1894393*Math.exp(-0.012778*m)+0.2989558*Math.exp(-0.1932605*m);return vo2/p}
function predict(V,dist){let lo=dist/1000*120,hi=dist/1000*600;for(let i=0;i<50;i++){const mid=(lo+hi)/2;vdot(dist,mid)>V?lo=mid:hi=mid}return (lo+hi)/2}
function bests(days){
  const lim=days?ymd(addD(TODAY(),-days)):'0';const B={};
  for(const a of D.acts){if(!isRun(a)||a.date<lim||a.type==='TrailRun'||/trilha|trail/i.test(a.name||''))continue;const x=AX[a.id];if(!x||!x.best)continue;
    for(const k in x.best){if(!B[k]||x.best[k]<B[k].t)B[k]={t:x.best[k],id:a.id,date:a.date}}
    // corrida com a distância exata: vale o tempo em movimento (sem as paradas)
    for(const [dist] of BE){if(a.dist>=dist*0.99&&a.dist<=dist*1.05&&a.mov){const tt=Math.round(a.mov*dist/a.dist);if(!B[dist]||tt<B[dist].t)B[dist]={t:tt,id:a.id,date:a.date}}}}
  return B;
}
function curVdot(){const B=bests(90);let best=null;for(const k in B){const dist=+k;if(dist<1500)continue;const v=vdot(dist,B[k].t);if(!best||v>best.v)best={v,dist,t:B[k].t}}return best}
function paceZones(V){ // ritmos de treino a partir do VDOT (% do VO2 máx)
  const vv=(v)=>{let lo=100,hi=500;for(let i=0;i<40;i++){const mid=(lo+hi)/2;(-4.6+0.182258*mid+0.000104*mid*mid)<v?lo=mid:hi=mid}return lo};
  const p=f=>60000/vv(V*f);
  return {E:[p(0.74),p(0.65)],M:[p(0.84),p(0.80)],T:[p(0.88),p(0.86)],I:[p(1.0),p(0.97)],R:[p(1.10),p(1.05)]};
}
const W=d=>D.well.find(w=>w.d===d);
function readiness(dt){
  const ds=ymd(dt),w=W(ds)||{},S=pmc(),p=S.find(x=>x.d===ds)||S[S.length-1];
  const base=D.well.filter(x=>x.d<ds&&x.d>=ymd(addD(dt,-28))&&x.rhr).map(x=>x.rhr);
  const rb=base.length?base.reduce((a,b)=>a+b,0)/base.length:null;
  let sc=0,parts=[];
  const sl=w.sleep;const sp=sl?40*clamp(sl/(7.5*3600),0,1):24;sc+=sp;parts.push(['SONO',sl?fmtSleep(sl):'--',sp/40]);
  let rp=22;if(w.rhr&&rb){const dl=w.rhr-rb;rp=30-clamp(dl,0,6)*5}sc+=rp;parts.push(['FC REPOUSO',w.rhr?w.rhr+(rb?(w.rhr-rb>=0?' (+':' (')+(w.rhr-rb).toFixed(0)+')':''):'--',rp/30]);
  const tp=30*clamp((p.tsb+30)/20,0,1);sc+=tp;parts.push(['EQUILÍBRIO',(Math.round(p.tsb*10)/10||0).toFixed(1),tp/30]);
  const ck=LS.get('ck',{})[ds];if(ck){sc+=(ck-3)*4}
  sc=Math.round(clamp(sc,0,100));
  return {sc,parts,st:sc>=75?'ÓTIMA':sc>=50?'BOA':'BAIXA',cls:sc>=75?'ok':sc>=50?'warn':'bad',w,rb,p};
}

      :{tipo:'longo',titulo:w.lt||('Longão '+w.l+' km'),km:w.l,steps:w.lt?[['Contínuo',(w.l-3)+'km',LONG],['Final','3km',[325,335]]]:[['Contínuo',w.l+'km',LONG]]});

function plan(){const ov=LS.get('ov',{});return planTemplate().map(p=>ov[p.date]?{...p,...ov[p.date]}:p)}
const planOn=ds=>plan().find(p=>p.date===ds);
const evOn=ds=>(D.ev||[]).find(e=>e.d===ds);
const runsOn=ds=>D.acts.filter(a=>isRun(a)&&a.date.slice(0,10)===ds);
const actsOn=ds=>D.acts.filter(a=>a.date.slice(0,10)===ds);
function status(p){
  const ex=runsOn(p.date),km_=ex.reduce((s,a)=>s+(a.dist||0),0)/1000;
  if(ex.length)return km_>=p.km*0.8?'cumprido':'parcial';

// ajuste adaptativo: proposta do Coach quando a prontidão está baixa
function adjust(p,r){
  if(!p||p.adjusted||p.date!==ymd(TODAY()))return null;

// texto no formato de treino do Intervals.icu (vai para o Garmin)
function toIcu(p){
  const pz=r=>r?(fmtP(Math.min(...r))+'-'+fmtP(Math.max(...r))+'/km Pace'):'Z1 HR';
  let out='',i=0;const st=p.steps;
  while(i<st.length){
    const s=st[i];
    if(s[3]&&st[i+1]&&st[i+1][3]===s[3]){out+=`\n${s[3]}x\n- ${s[1]} ${pz(s[2])}\n- ${st[i+1][1]} ${pz(st[i+1][2])}\n`;i+=2}

    else{out+=`\n${s[0]}\n- ${s[1]} ${pz(s[2])}\n`;i++}

}
async function sendWatch(ds){

/* ================= Coach (regras; Claude entra na fase 2) ================= */
function coachLast(a){
  const x=AX[a.id]||{},p=planOn(a.date.slice(0,10)),pace=a.mov&&a.dist?a.mov/a.dist*1000:null;
  const z=D.athlete&&D.athlete.run&&D.athlete.run.hr_zones||[148,157,166,175,180,185,194];
  const msg=[];
  // sessão intervalada: ritmo muito variável (coef. de variação > 25%) ou plano de qualidade
  const pv=(x.chart&&x.chart.p||[]).filter(v=>v&&v<900),mu=pv.reduce((s,v)=>s+v,0)/(pv.length||1);
  const cv=pv.length?Math.sqrt(pv.reduce((s,v)=>s+(v-mu)**2,0)/pv.length)/mu:0;
  const fast=[...pv].sort((m,n)=>m-n).slice(0,Math.max(1,Math.round(pv.length*0.15))),fm=fast.length?fast.reduce((s,v)=>s+v,0)/fast.length:0;
  const inter=p?.tipo==='qualidade'||/tiro|interval/i.test(a.name||'')||(cv>0.25&&fm&&fm<330);
  if(inter){
    msg.push(`Sessão intervalada. Trechos rápidos em torno de ${fmtP(fm)}/km, FC máxima ${a.hrmax||'--'} bpm.`);
    if(a.hrmax&&a.hrmax>=CFG.fcmax*0.95)msg.push('Chegou perto da FC máxima: estímulo forte, próximo treino deve ser leve.');
    return (p?`Planejado: ${p.titulo}. `:'')+msg.join(' ');
  }
  if(p){const r=a.dist/1000/p.km;msg.push(r>=0.95?`Treino cumprido: ${km(a.dist)} de ${p.km} km planejados.`:r>=0.8?`Volume quase completo (${Math.round(r*100)}% do planejado).`:`Volume abaixo do planejado (${Math.round(r*100)}%). Sem problema na fase de retorno; não compensar no próximo treino.`)}
  if(a.hr){const zi=z.findIndex(v=>a.hr<=v)+1;msg.push(`FC média ${a.hr} bpm (Z${zi||7})${zi<=2?': esforço aeróbico, base sendo construída.':zi<=4?': sessão moderada a forte.':': sessão intensa, priorizar recuperação.'}`)}
  if(x.dec!=null&&!p?.tipo?.match(/qualidade/))msg.push(x.dec<=5?`Deriva cardíaca ${x.dec}%: boa resistência aeróbica para esta duração.`:`Deriva cardíaca ${x.dec}%: a FC subiu no fim. Sinal de base aeróbica ainda curta; manter rodagens leves.`);
  if(x.splits&&x.splits.length>=3){const s=x.splits.filter(s=>!s.part);if(s.length>=3){const f=s[0].t,l=s[s.length-1].t;msg.push(l<f-5?'Parciais em progressão negativa: boa disciplina de ritmo.':l>f+15?'Ritmo caiu no fim; segurar mais o início.':'Ritmo estável do começo ao fim.')}}
  if(!msg.length&&pace)msg.push(`Ritmo médio ${fmtP(pace)}/km.`);
  return msg.join(' ');
}

const fmtD=ds=>ds.slice(8,10)+'/'+ds.slice(5,7);

function barsSvg(vals,days,target,col){

}
function lineSvg(vals,days,col,ref){
  const pts=vals.map((v,i)=>[i,v]).filter(p=>p[1]!=null);if(!pts.length)return '<p class="empty">Sem dados no período.</p>';

  return `<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:140px;border-bottom:1px solid var(--line)">${ref?`<line x1="0" x2="${w}" y1="${y(ref)}" y2="${y(ref)}" stroke="#c9a24a" stroke-width="1.5" stroke-dasharray="6 5"/>`:''}<polyline fill="none" stroke="${col}" stroke-width="2" points="${pts.map(p=>x(p[0]).toFixed(1)+','+y(p[1]).toFixed(1)).join(' ')}"/>${pts.length<25?pts.map(p=>`<circle cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="4" fill="${col}"/>`).join(''):''}</svg><div class="row meta" style="justify-content:space-between;margin-top:3px"><span>${fmtD(days[0])} · ${Math.round(mn+2)}–${Math.round(mx-2)}</span><span>${fmtD(days[days.length-1])}</span></div>`;
}

let calMode='sem',calRef=TODAY();
function rCal(){
  const ds0=ymd(TODAY());let h=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><div class="seg"><button class="${calMode==='sem'?'on':''}" onclick="calSet('sem')">SEMANAL</button><button class="${calMode==='mes'?'on':''}" onclick="calSet('mes')">MENSAL</button></div><button class="b sm" onclick="calGo(0)">HOJE</button></div>`;

    h+=`<div class="wk"><button class="b sm" onclick="calGo(-1)">◀</button><b>${m.getDate()} ${MES[m.getMonth()]} — ${e.getDate()} ${MES[e.getMonth()]}</b><button class="b sm" onclick="calGo(1)">▶</button></div>`;
    for(let i=0;i<7;i++){const d=addD(m,i),ds=ymd(d),p=planOn(ds),ex=actsOn(ds),w=W(ds)||{};
      const rk=ex.filter(isRun).reduce((s,a)=>s+(a.dist||0),0);tk+=rk;pk+=p?p.km*1000:0;
      h+=`<div class="day ${ds===ds0?'today':''}" onclick="openDay('${ds}')"><div class="d"><span>${DOW[d.getDay()]}</span><b>${pad(d.getDate())}</b></div><div style="min-width:0">
      ${p?`<div class="pl"><span class="tag ${status(p)==='cumprido'?'ok':status(p)==='perdido'?'bad':''}">${tipoIc[p.tipo]}</span> ${esc(p.titulo)} <span class="dim">· ${p.km} km</span></div>`:`<div class="pl dim">${ex.length?'':'Descanso'}</div>`}
      ${ex.map(a=>`<div class="ex">✓ ${typeIc(a)} ${a.dist?km(a.dist)+' km':fmtT(a.mov)}${isRun(a)&&a.dist?' · '+fmtP(a.mov/a.dist*1000)+'/km':''}${a.hr?' · '+a.hr+' bpm':''}</div>`).join('')}</div>
      <div class="vt">${w.sleep?'☾ '+fmtSleep(w.sleep):''}<br>${w.rhr?'♥ '+w.rhr:''}</div></div>`}
    h+=`<div class="card" style="margin-top:8px"><div class="row" style="justify-content:space-between"><span class="lbl">Volume da semana</span><span class="num">${pk?km(tk)+' / '+km(pk):km(tk)} km</span></div>${pk?`<div class="bar"><i style="width:${clamp(tk/pk*100,0,100)}%"></i></div>`:'<div class="meta" style="margin-top:4px">Sem treinos planejados nesta semana.</div>'}</div>`;
  }else{
    const y=calRef.getFullYear(),mo=calRef.getMonth(),f=monday(new Date(y,mo,1));
    h+=`<div class="wk"><button class="b sm" onclick="calGo(-1)">◀</button><b>${MES[mo]} ${y}</b><button class="b sm" onclick="calGo(1)">▶</button></div><div class="mgrid">${['SEG','TER','QUA','QUI','SEX','SÁB','DOM'].map(x=>`<div class="h">${x}</div>`).join('')}`;
    let tot=0;
    for(let i=0;i<42;i++){const d=addD(f,i),ds=ymd(d);if(i>=35&&d.getMonth()!==mo)break;const p=planOn(ds),rk=runsOn(ds).reduce((s,a)=>s+(a.dist||0),0),st=p&&status(p);if(d.getMonth()===mo)tot+=rk;
      h+=`<div class="mc ${d.getMonth()!==mo?'out':''} ${ds===ds0?'today':''}" onclick="openDay('${ds}')"><span class="n">${d.getDate()}</span>${rk?`<span class="k">${(rk/1000).toFixed(1)}</span>`:p?`<span class="k p">${p.km}</span>`:'<span></span>'}${p?`<span class="dot ${st==='cumprido'||st==='parcial'?'f':st==='perdido'?'x':''}"></span>`:rk?'<span class="dot f"></span>':'<span></span>'}</div>`}
    h+=`</div><div class="row meta" style="gap:14px;margin-top:8px"><span><span style="color:var(--blue)">●</span> cumprido</span><span><span style="color:var(--blue)">○</span> planejado</span><span style="color:#ff7a66">● perdido</span></div><div class="card" style="margin-top:10px"><div class="row" style="justify-content:space-between"><span class="lbl">Total corrido no mês</span><span class="num">${km(tot)} km</span></div></div>`;
  }
  $('#cal').innerHTML=h;
}

// metas com prazo: cumpridas quando uma corrida dentro da janela atinge a distância (e o tempo, se houver)
const METAS=[
  {nome:'10 KM EM NOVEMBRO',dist:10000,tempo:3300,ini:'2026-11-01',fim:'2026-11-30',txt:'Correr 10 km em até 55:00 (ritmo de 5:30/km).'},
  {nome:'MEIA MARATONA',dist:21097.5,ini:'2026-11-01',fim:'2026-12-31',txt:'Completar 21,1 km até o fim de dezembro.'},
  {nome:'30 KM',dist:30000,ini:'2026-11-01',fim:'2027-03-31',txt:'Passar o recorde de 26 km e fechar os 30 km.'},
];
function bestIn(a,dist){
  let b=(AX[a.id]&&AX[a.id].best||{})[dist]||null;
  if(a.dist>=dist*0.99&&a.dist<=dist*1.05&&a.mov){const tt=Math.round(a.mov*dist/a.dist);if(!b||tt<b)b=tt}
  return b;
}
function metaStatus(m){
  const runs=D.acts.filter(a=>isRun(a)&&a.date.slice(0,10)>=m.ini&&a.date.slice(0,10)<=m.fim&&a.dist>=m.dist*0.99);
  let best=null;for(const a of runs){const t=bestIn(a,m.dist)||a.mov;if(t&&(!best||t<best.t))best={t,a}}
  const hoje=ymd(TODAY());
  return {ok:!!best&&(!m.tempo||best.t<=m.tempo),best,dias:Math.round((parseD(m.fim)-TODAY())/864e5),fora:hoje>m.fim,antes:hoje<m.ini};
}
function rDes(){
  const t=TODAY(),m=monday(t),runs=D.acts.filter(isRun);
  const sum=(a,b)=>runs.filter(x=>x.date.slice(0,10)>=a&&x.date.slice(0,10)<=b).reduce((s,x)=>s+(x.dist||0),0)/1000;
  const wk=sum(ymd(m),ymd(addD(m,6))),wkPlan=plan().filter(p=>p.date>=ymd(m)&&p.date<=ymd(addD(m,6))).reduce((s,p)=>s+p.km,0)||15;
  const mo=sum(ymd(new Date(t.getFullYear(),t.getMonth(),1)),ymd(t)),moAlvo=t.getMonth()===10?75:60;
  let seq=0;for(let i=0;i<52;i++){const a=addD(m,-7*i),n=runs.filter(x=>x.date.slice(0,10)>=ymd(a)&&x.date.slice(0,10)<=ymd(addD(a,6))).length;if(n>=2)seq++;else if(i>0)break}
  const ch=[
    ['VOLUME DA SEMANA',`${wk.toFixed(1)} / ${wkPlan} km`,wk/wkPlan],
    [`VOLUME DE ${MES[t.getMonth()]}`,`${mo.toFixed(1)} / ${moAlvo} km`,mo/moAlvo],
    ['CONSTÂNCIA',`${seq} / 4 semanas seguidas com 2+ corridas`,seq/4],
  ];
  let h=`<div class="sec">PROGRESSO</div>`;
  h+=ch.map(c=>{const v=clamp(c[2],0,1);return `<div class="card ${v>=1?'cur':''}"><div class="row" style="justify-content:space-between"><span class="lbl" style="color:var(--txt)">${c[0]}</span><span class="num ${v>=1?'ok':''}" style="font-size:12px">${Math.round(v*100)}%</span></div><div class="meta" style="margin-top:3px">${c[1]}</div><div class="bar"><i style="width:${v*100}%"></i></div></div>`}).join('');
  h+=`<div class="sec">METAS<small>COM PRAZO</small></div>`;
  h+=METAS.map(mt=>{const s=metaStatus(mt);
    return `<div class="card ${s.ok?'cur':s.fora?'alert':''}"><div class="row" style="justify-content:space-between"><span class="lbl" style="color:var(--txt)">${mt.nome}</span>${s.ok?'<span class="tag ok">✓ CUMPRIDA</span>':s.fora?'<span class="tag bad">PRAZO ENCERRADO</span>':'<span class="tag">PENDENTE</span>'}</div>
    <div class="meta" style="margin-top:4px;color:var(--txt)">${mt.txt}</div>
    <div class="row meta" style="justify-content:space-between;margin-top:8px"><span>Prazo: ${mt.fim.split('-').reverse().join('/')}</span><span>${s.ok?'Feita em '+fmtD(s.best.a.date)+(mt.tempo?' · '+fmtT(s.best.t):''):s.fora?'':s.antes?'Começa em '+fmtD(mt.ini):'Faltam '+s.dias+' dias'}</span></div>
    ${!s.ok&&s.best&&mt.tempo?`<div class="meta" style="margin-top:4px">Melhor tentativa: ${fmtT(s.best.t)} (faltam ${fmtT(s.best.t-mt.tempo)})</div>`:''}</div>`}).join('');
  $('#des').innerHTML=h;
}

  openSheet(h);
};
function openSheet(h){const b=$('#sbox'),on=$('#sheet').classList.contains('on');b.innerHTML=h;b.style.transform='';if(!on)b.scrollTop=0;$('#sheet').classList.add('on')}
(()=>{const bx=$('#sbox');let y0=null,dy=0;
  bx.addEventListener('touchstart',e=>{y0=bx.scrollTop<=0?e.touches[0].clientY:null;dy=0;bx.style.transition='none'},{passive:true});
  bx.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0)bx.style.transform=`translateY(${dy}px)`},{passive:true});
  bx.addEventListener('touchend',()=>{bx.style.transition='transform .2s';if(dy>90){bx.style.transform='translateY(100%)';setTimeout(()=>{closeSheet();bx.style.transition='none';bx.style.transform=''},200)}else bx.style.transform='';y0=null;dy=0});
})();
window.closeSheet=()=>$('#sheet').classList.remove('on');
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});

/* ================= navegação ================= */
const TITLES={ini:'INÍCIO',cal:'CALENDÁRIO',des:'DESAFIOS',mais:'MAIS',perf:'PERFIL'};
let VIEW='ini';
function go(v){VIEW=v;document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('#ttl').textContent=TITLES[v];render()}
document.querySelectorAll('#tabbar button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#av').onclick=()=>go(VIEW==='perf'?'ini':'perf');
$('#sync').onclick=()=>sync(0);
function render(){
  const a=D.athlete;if(a&&a.pic)$('#avimg').src=a.pic;
  $('#avst').className=D.at&&Date.now()-D.at<864e5?'on':D.at?'off':'';
  ({ini:rIni,cal:rCal,des:rDes,mais:rMais,perf:rPerf})[VIEW]();
}
window.sync=sync;window.sendWatch=sendWatch;
render();
if(CFG.key&&(!D.at||Date.now()-D.at>30*60e3))sync(0);
</script>
