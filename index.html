<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Boonie Run</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
// no iPhone aberto pela Tela de Início (barra de status transparente) a página recebe a altura da tela menos a barra de status,
// e sobra uma faixa preta embaixo; aqui o app ocupa a altura real da tela, em qualquer modelo e orientação
(function(){
  const fit=()=>{let h=innerHeight;
    if(navigator.standalone){const deitado=innerWidth>innerHeight,s=deitado?Math.min(screen.width,screen.height):Math.max(screen.width,screen.height);h=Math.max(h,s)}
    document.documentElement.style.setProperty('--app-h',h+'px')};
  fit();addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,300));
})();
</script>
<style>
:root{--bg:#000;--panel:#0d0d0d;--line:#252a31;--blue:#4a9eff;--amber:#c9a24a;--red:#e0442f;--ok:#7cc4ff;--cy:#f2f4ee;--txt:#f2f4ee;--dim:#8a929e;--f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Inter,Arial,sans-serif;--m:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:var(--app-h,100%);background:var(--bg);color:var(--txt);font-family:var(--f);font-variant-numeric:tabular-nums;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{position:relative;overflow:hidden} /* as camadas absolutas (abas, telas, painéis) seguem a altura corrigida do corpo */
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#top{position:absolute;top:0;left:0;right:0;z-index:9;background:linear-gradient(var(--panel),#080808);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:10px}
#top .brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
#top .brand img{height:34px;mix-blend-mode:screen}
#top .brand b{color:#fff;letter-spacing:.16em;font-size:14px;white-space:nowrap}
#top .brand small{color:var(--dim);letter-spacing:.1em;font-size:9px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#av{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--blue);padding:2px;background:none;flex:none}
#av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#111}
#av i{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--dim);border:2px solid #000}
#av i.on{background:var(--ok)}#av i.off{background:var(--red)}
.view{position:absolute;left:0;right:0;top:calc(57px + env(safe-area-inset-top));bottom:calc(60px + env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px max(12px,env(safe-area-inset-left)) 28px;display:none}
.view.on{display:block}
.wrap{max-width:480px;margin:0 auto}
#tabbar{position:absolute;left:0;right:0;bottom:0;z-index:9;height:calc(60px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#000;border-top:1px solid var(--line);display:flex}
#tabbar button{flex:1;min-width:0;background:none;border:0;color:var(--dim);font-size:8.5px;letter-spacing:.03em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
#tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
#tabbar button.on{color:var(--blue);box-shadow:inset 0 2px var(--blue)}
.sec{margin:20px 0 8px;padding-bottom:6px;color:var(--amber);letter-spacing:.14em;font-size:11px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;min-height:34px}
.sec span{display:flex;align-items:center}
.q{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#070707;color:var(--dim);font-size:12px;margin-left:8px;padding:0;line-height:1;font-family:var(--m)}
.help p{font-size:13px;line-height:1.6;color:var(--txt);margin-bottom:10px}.help b{color:var(--blue);font-weight:600}
details.card summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:30px;font-size:13px;color:#fff;cursor:pointer}
details.card summary::-webkit-details-marker{display:none}
details.card summary:after{content:'▾';color:var(--dim);margin-left:auto;transition:transform .2s}
details[open].card summary:after{transform:rotate(180deg)}
.more{display:block;width:100%;margin-top:8px}
.sec:first-child{margin-top:4px}
.sec small{color:var(--dim);letter-spacing:.08em;font-size:10px}
.card{border:1px solid var(--line);background:var(--panel);padding:12px;margin-bottom:10px;border-radius:8px;position:relative}
.card.cur{border-color:var(--blue);box-shadow:inset 3px 0 var(--blue)}
.card.alert{border-color:var(--red);box-shadow:inset 3px 0 var(--red)}
.card h2{font-size:15px;color:#fff;margin-bottom:2px}
.meta{color:var(--dim);font-size:11px;letter-spacing:.04em}
.lbl{color:var(--dim);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.num{font-family:var(--m);color:#fff;font-weight:600}
.big{font-size:26px;line-height:1.1}
.grid{display:grid;gap:8px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}
.cell{border:1px solid var(--line);background:#070707;padding:8px;border-radius:6px;min-width:0;position:relative}
.cell.tap{text-align:left;color:inherit;font:inherit;width:100%;display:block}
.cell.tap:after{content:'›';position:absolute;right:8px;top:5px;color:var(--blue);font-size:16px}
.cell.tap:active{background:#0a1828}
.cell .num{font-size:17px;display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .num small{font-size:11px;color:var(--dim);font-weight:400}
.ok{color:var(--ok)!important}.warn{color:var(--amber)!important}.bad{color:#ff7a66!important}.dim{color:var(--dim)!important}
.b{min-height:44px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);color:#fff;border-radius:6px;letter-spacing:.1em;font-size:11px;text-transform:uppercase}
.b.pri{background:#0a1828;border-color:var(--blue);color:var(--blue)}
.b.red{color:#ff7a66;border-color:var(--red);background:#1a0805}
.b.sm{padding:0 12px;min-height:38px;min-width:40px;font-size:10px}
.b.full{width:100%}
.b:disabled{opacity:.4}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.coach{margin-top:10px;border-top:1px dashed var(--line);padding-top:9px;font-size:12px;line-height:1.55;color:var(--txt)}
.coach b{color:var(--blue);letter-spacing:.12em;font-size:10px;display:block;margin-bottom:3px}
.bar{height:6px;background:#12161c;border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue)}
.bar.red i{background:var(--red)}
.steps{margin-top:8px;font-family:var(--m);font-size:12px}
.steps div{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid #15181d}
.steps div span:first-child{color:var(--dim);width:88px;flex:none;font-family:var(--f);font-size:11px;letter-spacing:.04em}
.tag{display:inline-block;font-size:9px;letter-spacing:.12em;padding:2px 6px;border:1px solid var(--line);border-radius:3px;color:var(--dim);text-transform:uppercase}
.tag.ok{border-color:var(--blue);color:var(--blue)}.tag.bad{border-color:var(--red);color:#ff7a66}.tag.warn{border-color:var(--amber);color:var(--amber)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--dim);font-weight:400;font-size:10px;letter-spacing:.1em;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;border-bottom:1px solid #15181d;font-family:var(--m)}
td.r,th.r{text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;background:none;border:0;padding:0 14px;min-height:38px;color:var(--dim);font-size:10px;letter-spacing:.12em}
.seg button.on{background:#0a1828;color:var(--blue)}
.wk{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.wk b{font-size:12px;letter-spacing:.1em}
.day{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 10px;margin-bottom:6px}
.day.today{border-color:var(--blue)}
.day .d{text-align:center}
.day .d b{display:block;font-size:18px;font-family:var(--m);color:#fff}
.day .d span{font-size:9px;letter-spacing:.12em;color:var(--dim)}
.day .pl{font-size:12px;color:var(--txt);line-height:1.4}
.day .ex{font-size:12px;font-family:var(--m);color:var(--ok);margin-top:2px}
.day .vt{font-size:10px;color:var(--dim);text-align:right;font-family:var(--m);line-height:1.5}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mgrid .h{font-size:9px;color:var(--dim);letter-spacing:.1em;text-align:center;padding:4px 0}
.mc{aspect-ratio:1/1.15;border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:4px;font-size:10px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.mc.out{opacity:.25}.mc.today{border-color:var(--blue)}
.mc .n{color:var(--dim);font-family:var(--m)}
.mc .k{font-family:var(--m);color:#fff;font-size:11px}
.mc .k.p{color:var(--dim)}
.mc .dot{width:7px;height:7px;border-radius:50%;border:1px solid var(--blue)}
.mc .dot.f{background:var(--blue)}.mc .dot.x{border-color:var(--red);background:var(--red)}
.list .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #15181d}
.list .it .ic{width:34px;height:34px;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:.06em;color:var(--blue);flex:none}
.list .it .t{flex:1;min-width:0}
.list .it .t b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .it .v{font-family:var(--m);font-size:12px;text-align:right}
.badge{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;padding:10px 4px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.badge .hx{width:44px;height:44px}
.badge b{font-size:10px;letter-spacing:.08em}
.badge small{font-size:9px;color:var(--dim)}
.badge.lock{opacity:.35}
#sheet{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.75);display:none}
#sheet.on{display:block}
#sheet .box{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - 40px - env(safe-area-inset-top));overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:#050505;border-top:1px solid var(--blue);border-radius:14px 14px 0 0;padding:22px 12px calc(24px + env(safe-area-inset-bottom))}
#sheet .box:before{content:"";position:absolute;top:8px;left:calc(50% - 18px);width:36px;height:4px;border-radius:2px;background:var(--line)}
#sheet .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
#sheet .hd b{color:var(--amber);letter-spacing:.14em;font-size:12px}
label.f{display:block;color:var(--dim);font-size:10px;letter-spacing:.1em;margin:10px 0 4px;text-transform:uppercase}
input,select{width:100%;background:#000;border:1px solid var(--line);padding:10px;border-radius:6px;-webkit-user-select:text;user-select:text;font-size:16px}
svg.ch{width:100%;display:block}
#toast{position:absolute;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);z-index:30;background:#0d0d0d;border:1px solid var(--blue);color:var(--blue);padding:9px 14px;border-radius:6px;font-size:11px;letter-spacing:.1em;display:none;max-width:90%;text-align:center}
#toast.on{display:block}
.empty{color:var(--dim);font-size:12px;line-height:1.5}
.ring{display:flex;align-items:center;gap:14px}
.ring svg{width:86px;height:86px;flex:none}
.feel{display:flex;gap:6px}
.feel button{flex:1;min-height:44px;background:#070707;border:1px solid var(--line);border-radius:6px;font-family:var(--m);color:var(--dim)}
.feel button.on{border-color:var(--blue);color:var(--blue);background:#0a1828}
.map{position:relative;margin-top:10px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000}.map .mimg{position:absolute;inset:0;width:100%;height:100%;display:block}.map span{position:absolute;right:6px;bottom:3px;z-index:2;font-size:8px;color:#5c636d;letter-spacing:.02em}
#recfab{position:absolute;z-index:8;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));height:58px;min-width:58px;border-radius:29px;background:rgba(5,5,5,.92);border:1px solid var(--blue);display:none;align-items:center;justify-content:center;gap:9px;padding:0 17px;box-shadow:0 6px 22px rgba(0,0,0,.7)}
#recfab.on{display:flex}#recfab i{width:20px;height:20px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(224,68,47,.22);flex:none}
#recfab span{display:none;font-family:var(--m);font-size:14px;color:#fff;font-weight:600}#recfab.live{right:auto;left:50%;transform:translateX(-50%)}#recfab.live span{display:inline}#recfab.live i{animation:pl 1.2s infinite}@keyframes pl{50%{opacity:.3}}
#v-ini{padding-bottom:96px}
#rec{position:absolute;inset:0;z-index:15;background:#000;display:none;flex-direction:column}#rec.on{display:flex}
.rtop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line);background:linear-gradient(var(--panel),#080808)}
#rmap{flex:1 1 auto;min-height:150px;position:relative;background:#000}#r-st:empty{display:none}
.rmet{padding:8px 14px 0}.rbig{text-align:center;font-family:var(--m);font-size:52px;font-weight:700;color:#fff;line-height:1.05}
.rctl{display:flex;justify-content:center;gap:22px;padding:14px 0 calc(16px + env(safe-area-inset-bottom))}
.rbtn{width:80px;height:80px;border-radius:50%;border:2px solid var(--blue);background:#0a1828;color:var(--blue);font-size:11px;letter-spacing:.1em;font-weight:600;padding:0}.rbtn.red{border-color:var(--red);background:#1a0805;color:#ff7a66}.rbtn.amb{border-color:var(--amber);background:#1a1405;color:var(--amber)}
#v-comp{padding:0;overflow:hidden}#comp{max-width:none;height:100%;position:relative}#cmap{position:absolute;inset:0;background:#000}
.cbar{position:absolute;z-index:3;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}.cbar>*{pointer-events:auto}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:18px;background:rgba(5,5,5,.86);border:1px solid var(--line);color:var(--txt);font-size:10px;letter-spacing:.1em;white-space:nowrap}.chip.b{color:var(--blue);border-color:var(--blue);min-width:0}
.fab{position:absolute;z-index:3;right:12px;bottom:40px;width:50px;height:50px;border-radius:50%;background:rgba(5,5,5,.9);border:1px solid var(--blue);color:var(--blue);font-size:22px;line-height:1;padding:0}
.maplibregl-ctrl-attrib{background:rgba(0,0,0,.6)!important;color:#5c636d!important;font-size:9px}.maplibregl-ctrl-attrib a{color:#5c636d!important}.maplibregl-ctrl-attrib-button{filter:invert(1) opacity(.5)}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
body.ob #tabbar,body.ob #sync,body.ob #av{display:none}
body.ob .view{bottom:0}
.obh{font-size:22px;color:#fff;line-height:1.25;margin:4px 0 6px}
.obp{color:var(--dim);font-size:14px;line-height:1.5;margin-bottom:16px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:54px;padding:11px 14px;margin-bottom:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:#fff;font-size:15px;text-align:left}
.opt small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.opt.on{border-color:var(--blue);background:#0a1828}
.opt.on:after{content:'✓';color:var(--blue);font-weight:700}
.chips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.chips button{min-height:50px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--dim);font-size:11px;letter-spacing:.06em;padding:0}
.chips button.on{border-color:var(--blue);color:var(--blue);background:#0a1828}
.stp{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--panel)}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:44px;display:block}
select{min-height:44px}

</style>
</head>
<body>
<header id="top">
  <div class="brand"><img src="logo.png" alt=""><div><b id="ttl">INÍCIO</b><small>BOONIE RUN</small></div></div>
  <button id="sync" class="b sm" title="Sincronizar">SYNC</button>
  <button id="av" aria-label="Perfil"><img id="avimg" src="logo.png" alt=""><i id="avst"></i></button>
</header>

<main>
  <section class="view on" id="v-ini"><div class="wrap" id="ini"></div></section>
  <section class="view" id="v-cal"><div class="wrap" id="cal"></div></section>
  <section class="view" id="v-des"><div class="wrap" id="des"></div></section>
  <section class="view" id="v-comp"><div class="wrap" id="comp"></div></section>
  <section class="view" id="v-mais"><div class="wrap" id="mais"></div></section>
  <section class="view" id="v-perf"><div class="wrap" id="perf"></div></section>
</main>

<nav id="tabbar">
  <button data-v="ini" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg>INÍCIO</button>
  <button data-v="cal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>CALENDÁRIO</button>
  <button data-v="des"><svg viewBox="0 0 24 24"><path d="M6 3v18M6 4h11l-2 4 2 4H6"/></svg>DESAFIOS</button>
  <button data-v="comp"><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M9 17h6"/></svg>COMPETITIVO</button>
  <button data-v="mais"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>MAIS</button>
</nav>

<div id="sheet"><div class="box" id="sbox"></div></div>
<button id="recfab" onclick="openRec()" aria-label="Gravar corrida"><i></i><span id="recfab-t"></span></button>
<div id="rec"></div>
<div id="toast"></div>

<script src="config.local.js" onerror="void 0"></script>
<script>
'use strict';
/* ================= util ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem('br.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('br.'+k,JSON.stringify(v))}catch(e){}}};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const [y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=(x.getDay()+6)%7;return addD(x,-w)};
const TODAY=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const DOW=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const MES=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
const fmtT=s=>{if(s==null||!isFinite(s))return '--';s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+':'+pad(m)+':'+pad(x):m+':'+pad(x)};

/* streams → parciais por km, melhores esforços, deriva cardíaca */
const BE=[[1000,'1 KM'],[3000,'3 KM'],[5000,'5 KM'],[10000,'10 KM'],[21097.5,'21 KM'],[30000,'30 KM'],[42195,'42 KM']];
async function analyzeRuns(full){

async function loadAX(id){
  const s=await api(`/activity/${id}/streams?types=time,distance,heartrate,velocity_smooth,altitude,latlng`);
  const f=k=>s.find(x=>x.type===k)||{},g=k=>f(k).data||[];
  AX[id]=analyze(g('time'),g('distance'),g('heartrate'),g('altitude'),f('latlng'));

function analyze(t,d,hr,alt,ll){
  const out={splits:[],best:{},dec:null,chart:null};
  if(!t.length||!d.length)return out;
  // saltos de GPS: trecho acima de 6,5 m/s (2:34/km) não conta distância
  const c=[d[0]||0];for(let i=1;i<d.length;i++){const dd=(d[i]||0)-(d[i-1]||0),dt=(t[i]-t[i-1])||1;c.push(c[i-1]+(dd>0&&dd/dt<=6.5?dd:0))}
  d=c;
  // pausas: intervalo acima de 30 s vira o tempo que levaria no ritmo anterior
  const tm=[0];for(let i=1;i<t.length;i++){const dt=t[i]-t[i-1],dd=d[i]-d[i-1];let e=dt;if(dt>30){const pt=i>1?t[i-1]-t[i-2]:0,v=pt>0&&pt<=30?(d[i-1]-d[i-2])/pt:3;e=dd>0?dd/clamp(v,1.5,6):0}tm.push(tm[i-1]+e)}
  t=tm;
  // parciais por km
  let k=1,i0=0,t0=t[0];
  for(let i=1;i<d.length;i++){
    if(d[i]>=k*1000){
      const f=(k*1000-d[i-1])/((d[i]-d[i-1])||1),tk=t[i-1]+f*(t[i]-t[i-1]);
      const h=hr.slice(i0,i+1).filter(Boolean),hv=h.length?Math.round(h.reduce((x,y)=>x+y,0)/h.length):null;
      const el=alt.length?Math.round(alt[i]-alt[i0]):null;
      out.splits.push({km:k,t:tk-t0,hr:hv,el});t0=tk;i0=i;k++;
    }
  }
  const rest=d[d.length-1]-(k-1)*1000;
  if(rest>100){const h=hr.slice(i0).filter(Boolean);out.splits.push({km:k-1+rest/1000,part:rest,t:t[t.length-1]-t0,hr:h.length?Math.round(h.reduce((x,y)=>x+y,0)/h.length):null,el:alt.length?Math.round(alt[alt.length-1]-alt[i0]):null})}
  // melhores esforços (janela deslizante)
  for(const [dist] of BE){
    if(d[d.length-1]<dist)continue;
    let j=0,best=Infinity;
    for(let i=0;i<d.length;i++){
      while(j<d.length&&d[j]-d[i]<dist)j++;
      if(j>=d.length)break;
      const f=(dist-(d[j-1]-d[i]))/((d[j]-d[j-1])||1),tt=(t[j-1]+f*(t[j]-t[j-1]))-t[i];
      if(tt>0&&tt<best)best=tt;
    }
    if(isFinite(best))out.best[dist]=Math.round(best);
  }
  // deriva cardíaca (ritmo/FC 1ª metade vs 2ª)
  if(hr.length===t.length){
    const mv=[];for(let i=1;i<t.length;i++){const dt=t[i]-t[i-1],dd=d[i]-d[i-1];if(dt>0&&dt<=10&&dd/dt>1.6&&hr[i])mv.push([dt,dd,hr[i]])}
    const tot=mv.reduce((s,x)=>s+x[0],0);
    if(tot>1200){let acc=0,h1=[0,0,0],h2=[0,0,0];for(const x of mv){const h=(acc+=x[0])<=tot/2?h1:h2;h[0]+=x[0];h[1]+=x[1];h[2]+=x[2]*x[0]}
      const e1=(h1[1]/h1[0])/(h1[2]/h1[0]),e2=(h2[1]/h2[0])/(h2[2]/h2[0]),dec=Math.round((e1-e2)/e1*1000)/10;if(Math.abs(dec)<=30)out.dec=dec}
  }
  // gráfico reduzido (até 120 pontos)
  const n=Math.max(1,Math.floor(t.length/120));const P=[],H=[];
  for(let i=n;i<t.length;i+=n){const dd=d[i]-d[i-n],tt=t[i]-t[i-n];P.push(dd>0?tt/dd*1000:null);H.push(hr[i]||null)}
  out.chart={p:P,h:H};
  // trajeto reduzido (até ~300 pontos); o Intervals manda a latitude em data e a longitude em data2
  if(ll&&ll.data&&ll.data2){const la=ll.data,lo=ll.data2,st=Math.max(1,Math.ceil(la.length/300)),tr=[];
    const ix=[];for(let i=0;i<la.length;i+=st)ix.push(i);if(ix[ix.length-1]!==la.length-1)ix.push(la.length-1);
    for(const i of ix){if(la[i]==null||lo[i]==null||(!la[i]&&!lo[i]))continue;const q=tr[tr.length-1];
      if(q&&Math.abs(la[i]-q[0])+Math.abs(lo[i]-q[1])>0.005)continue; // salto de GPS
      tr.push([+la[i].toFixed(5),+lo[i].toFixed(5)])}
    if(tr.length>1)out.map=tr}
  return out;
}

// carga do dia: HRSS do Intervals; sem ele, TRIMP de Banister pela FC média
function loadOf(a){
  if(a.load!=null)return a.load;
  if(a.hr&&a.mov){const r=clamp((a.hr-CFG.fcrep)/(CFG.fcmax-CFG.fcrep),0,1);return a.mov/60*r*0.64*Math.exp(1.92*r)}
  return 0;
}
function pmc(){ // CTL 42 d, ATL 7 d (EWMA), TSB = CTL − ATL do dia anterior
  const byDay={};for(const a of D.acts){const k=a.date.slice(0,10);byDay[k]=(byDay[k]||0)+loadOf(a)}
  const t=TODAY();let d=addD(t,-400),ctl=0,atl=0;const S=[];
  while(d<=t){const L=byDay[ymd(d)]||0;const tsb=ctl-atl;ctl+=(L-ctl)/42;atl+=(L-atl)/7;S.push({d:ymd(d),L,ctl,atl,tsb});d=addD(d,1)}
  return S;
}
// VDOT (Daniels & Gilbert)
function vdot(dist,sec){const m=sec/60,v=dist/m;const vo2=-4.6+0.182258*v+0.000104*v*v;const p=0.8+0.1894393*Math.exp(-0.012778*m)+0.2989558*Math.exp(-0.1932605*m);return vo2/p}
function predict(V,dist){let lo=dist/1000*120,hi=dist/1000*600;for(let i=0;i<50;i++){const mid=(lo+hi)/2;vdot(dist,mid)>V?lo=mid:hi=mid}return (lo+hi)/2}
function bests(days){
  const lim=days?ymd(addD(TODAY(),-days)):'0';const B={};
  for(const a of D.acts){if(!isRun(a)||a.date<lim||a.type==='TrailRun'||/trilha|trail/i.test(a.name||''))continue;const x=AX[a.id];if(!x||!x.best)continue;
    for(const k in x.best){if(!B[k]||x.best[k]<B[k].t)B[k]={t:x.best[k],id:a.id,date:a.date}}
    // corrida com a distância exata: vale o tempo em movimento (sem as paradas)
    for(const [dist] of BE){if(a.dist>=dist*0.99&&a.dist<=dist*1.05&&a.mov){const tt=Math.round(a.mov*dist/a.dist);if(!B[dist]||tt<B[dist].t)B[dist]={t:tt,id:a.id,date:a.date}}}}
  return B;
}
function curVdot(){const B=bests(90);let best=null;for(const k in B){const dist=+k;if(dist<1500)continue;const v=vdot(dist,B[k].t);if(!best||v>best.v)best={v,dist,t:B[k].t}}return best}
function paceZones(V){ // ritmos de treino a partir do VDOT (% do VO2 máx)
  const vv=(v)=>{let lo=100,hi=500;for(let i=0;i<40;i++){const mid=(lo+hi)/2;(-4.6+0.182258*mid+0.000104*mid*mid)<v?lo=mid:hi=mid}return lo};
  const p=f=>60000/vv(V*f);
  return {E:[p(0.74),p(0.65)],M:[p(0.84),p(0.80)],T:[p(0.88),p(0.86)],I:[p(1.0),p(0.97)],R:[p(1.10),p(1.05)]};
}
const W=d=>D.well.find(w=>w.d===d);
function readiness(dt){
  const ds=ymd(dt),w=W(ds)||{},S=pmc(),p=S.find(x=>x.d===ds)||S[S.length-1];
  const base=D.well.filter(x=>x.d<ds&&x.d>=ymd(addD(dt,-28))&&x.rhr).map(x=>x.rhr);
  const rb=base.length?base.reduce((a,b)=>a+b,0)/base.length:null;
  let sc=0,parts=[];
  const sl=w.sleep;const sp=sl?40*clamp(sl/(7.5*3600),0,1):24;sc+=sp;parts.push(['SONO',sl?fmtSleep(sl):'--',sp/40]);
  let rp=22;if(w.rhr&&rb){const dl=w.rhr-rb;rp=30-clamp(dl,0,6)*5}sc+=rp;parts.push(['FC REPOUSO',w.rhr?w.rhr+(rb?(w.rhr-rb>=0?' (+':' (')+(w.rhr-rb).toFixed(0)+')':''):'--',rp/30]);
  const tp=30*clamp((p.tsb+30)/20,0,1);sc+=tp;parts.push(['EQUILÍBRIO',(Math.round(p.tsb*10)/10||0).toFixed(1),tp/30]);
  const ck=LS.get('ck',{})[ds];if(ck){sc+=(ck-3)*4}

  return {sc,parts,st:gen(sc>=75?'ÓTIMO':sc>=50?'BOM':'BAIXO'),cls:sc>=75?'ok':sc>=50?'warn':'bad',w,rb,p};
}

function genPlan(pf){
  const Z=zonesFor(pf.V),E=Z.E,M=META[pf.meta]||META.c,novo=!pf.km0,P=[];
  const dias=[...pf.dias].sort((a,b)=>(a+6)%7-(b+6)%7),outros=dias.filter(d=>d!==pf.longo),k=outros.length;

  const ini=parseD(pf.inicio),N=M.sem+(novo&&M.d>=10?RW.length:0),m0=addD(monday(ini),(ini.getDay()+6)%7>(dias[dias.length-1]+6)%7?7:0);

  const capL=M.d?Math.max(L,M.d>21?19:M.d+1):L+3,pico=Math.min(M.d?Math.max(W,{5:20,10:30,21:45}[pf.meta]):W*1.3,Math.max(W,capL+k*9));
  for(let w=0;w<N;w++){
    const add=(d,o)=>{const ds=ymd(addD(m0,7*w+(d+6)%7));if(ds>=pf.inicio)P.push({date:ds,...o})};
    if(M.d&&w===N-1){ // semana da prova: só rodagens curtas antes do dia D
      outros.filter(d=>(d+1)%7!==pf.longo).forEach(d=>add(d,{tipo:'rodagem',titulo:'Rodagem curta',km:3,steps:[['Contínuo','3km',E]]}));
      const rp=Math.round(predict(pf.V,M.dist)/M.d);
      add(pf.longo,{tipo:'prova',titulo:'DIA D: '+M.n,km:M.d,steps:[['Contínuo',M.d+'km',[rp,rp+15]]]});
      break;
    }
    if(novo&&w<RW.length){const [c,cw]=RW[w];
      dias.forEach(d=>{const lg=d===pf.longo,rp=Math.round(30/(c+cw))+(lg?1:0);add(d,{tipo:lg?'longo':'rodagem',titulo:`Corre ${c} min, caminha ${cw} (${rp}×)`,km:r5(rp*(c*60/E[1]+cw/10)),steps:[['Corre',c+'min',E,rp],['Caminhada',cw+'min',null,rp]]})});

    const qs=k?quality(r5(clamp(resto/k*1.15,3,10)),novo?0:w/N,dl,Z):null,e=k>1?r5(clamp((resto-qs.km)/(k-1),3,10)):0;

    outros.forEach((d,i)=>add(d,i===0?qs:{tipo:'rodagem',titulo:'Rodagem leve',km:e,steps:[['Contínuo',e+'km',E]]}));
    if(!dl){W=Math.min(W*1.08,pico);L=Math.min(L+(M.d>21?1.5:1),capL)}

  return P;
}

const actsOn=ds=>D.acts.filter(a=>a.date.slice(0,10)===ds);
function status(p){
  const ex=runsOn(p.date),km_=ex.reduce((s,a)=>s+(a.dist||0),0)/1000;
  if(ex.length)return km_>=p.km*0.8?'cumprido':'parcial';
  if(p.date<ymd(TODAY()))return 'perdido';
  return evOn(p.date)?'enviado':'planejado';
}
// ajuste adaptativo: proposta do Coach quando a prontidão está baixa
function adjust(p,r){
  if(!p||p.adjusted||p.date!==ymd(TODAY()))return null;
  if(r.sc<50&&p.tipo!=='rodagem')return {why:`Disposição ${r.sc}/100. Treino de qualidade trocado por rodagem regenerativa para não acumular fadiga.`,new:{tipo:'rodagem',titulo:'Regenerativo (ajuste do Coach)',km:Math.max(3,Math.round(p.km*0.6)),steps:[['Contínuo',Math.max(3,Math.round(p.km*0.6))+'km',[390,420]]],adjusted:1}};
  if(r.sc<65&&(p.tipo==='longo'||p.tipo==='qualidade')){const k=Math.round(p.km*0.8);return {why:`Disposição ${r.sc}/100. Volume reduzido em 20% e ritmo mais solto.`,new:{km:k,titulo:p.titulo+' (−20%)',steps:p.steps.map(s=>[s[0],s[1].endsWith('km')&&s[3]==null?Math.max(1,Math.round(parseFloat(s[1])*0.8))+'km':s[1],s[2]&&[s[2][0]+10,s[2][1]+10],s[3]?Math.max(1,s[3]-1):undefined]),adjusted:1}}}
  return null;
}
// texto no formato de treino do Intervals.icu (vai para o Garmin)
function toIcu(p){
  const pz=r=>r?(fmtP(Math.min(...r))+'-'+fmtP(Math.max(...r))+'/km Pace'):'Z1 HR';
  // no Intervals "m" é minuto e metro é "mtr"
  const du=x=>/min$/.test(x)?x.replace(/min$/,'m'):/\dm$/.test(x)?x.replace(/m$/,'mtr'):x;
  let out='',i=0;const st=p.steps.map(s=>{const c=[...s];c[1]=du(s[1]);return c});
  while(i<st.length){
    const s=st[i];
    if(s[3]&&st[i+1]&&st[i+1][3]===s[3]){out+=`\n${s[3]}x\n- ${s[1]} ${pz(s[2])}\n- ${st[i+1][1]} ${pz(st[i+1][2])}\n`;i+=2}
    else if(s[3]){out+=`\n${s[3]}x\n- ${s[1]} ${pz(s[2])}\n`;i++}
    else{out+=`\n${s[0]}\n- ${s[1]} ${pz(s[2])}\n`;i++}
  }
  return out.trim();
}
async function sendWatch(ds){
  const p=planOn(ds);if(!p)return;
  if(!confirm(`${evOn(ds)?'Atualizar':'Enviar'} "${p.titulo}" (${ds.split('-').reverse().join('/')}) no calendário do Intervals.icu?\n\nO Intervals repassa ao Garmin Connect, e o relógio recebe na próxima sincronização.`))return;
  try{
    const old=evOn(ds),body=JSON.stringify({category:'WORKOUT',type:'Run',start_date_local:ds+'T00:00:00',name:p.titulo,description:toIcu(p)});
    const ev=old?await api(`/athlete/${CFG.athlete}/events/${old.id}`,{method:'PUT',body}):await api(`/athlete/${CFG.athlete}/events`,{method:'POST',body});
    D.ev=(D.ev||[]).filter(e=>e.d!==ds).concat([{id:ev.id,d:ds,name:ev.name}]);LS.set('data',D);
    toast(D.athlete&&D.athlete.gUp?'TREINO ENVIADO AO RELÓGIO':'ENVIADA AO INTERVALS // LIGUE O ENVIO AO GARMIN',3500);render();
  }catch(e){toast('FALHA NO ENVIO // '+e.message,3500)}
}

/* ================= Coach (regras; Claude entra na fase 2) ================= */
function coachLast(a){
  const x=AX[a.id]||{},p=planOn(a.date.slice(0,10)),pace=a.mov&&a.dist?a.mov/a.dist*1000:null;
  const z=D.athlete&&D.athlete.run&&D.athlete.run.hr_zones||[148,157,166,175,180,185,194];
  const msg=[];
  // sessão intervalada: ritmo muito variável (coef. de variação > 25%) ou plano de qualidade
  const pv=(x.chart&&x.chart.p||[]).filter(v=>v&&v<900),mu=pv.reduce((s,v)=>s+v,0)/(pv.length||1);
  const cv=pv.length?Math.sqrt(pv.reduce((s,v)=>s+(v-mu)**2,0)/pv.length)/mu:0;
  const fast=[...pv].sort((m,n)=>m-n).slice(0,Math.max(1,Math.round(pv.length*0.15))),fm=fast.length?fast.reduce((s,v)=>s+v,0)/fast.length:0;
  const inter=p?.tipo==='qualidade'||/tiro|interval/i.test(a.name||'')||(cv>0.25&&fm&&fm<330);
  if(inter){
    msg.push(`Sessão intervalada. Trechos rápidos em torno de ${fmtP(fm)}/km, FC máxima ${a.hrmax||'--'} bpm.`);
    if(a.hrmax&&a.hrmax>=CFG.fcmax*0.95)msg.push('Chegou perto da FC máxima: estímulo forte, próximo treino deve ser leve.');
    return (p?`Planejado: ${p.titulo}. `:'')+msg.join(' ');
  }
  if(p){const r=a.dist/1000/p.km;msg.push(r>=0.95?`Treino cumprido: ${km(a.dist)} de ${p.km} km planejados.`:r>=0.8?`Volume quase completo (${Math.round(r*100)}% do planejado).`:`Volume abaixo do planejado (${Math.round(r*100)}%). Sem problema na fase de retorno; não compensar no próximo treino.`)}
  if(a.hr){const zi=z.findIndex(v=>a.hr<=v)+1;msg.push(`FC média ${a.hr} bpm (Z${zi||7})${zi<=2?': esforço aeróbico, base sendo construída.':zi<=4?': sessão moderada a forte.':': sessão intensa, priorizar recuperação.'}`)}
  if(x.dec!=null&&!p?.tipo?.match(/qualidade/))msg.push(x.dec<=5?`Deriva cardíaca ${x.dec}%: boa resistência aeróbica para esta duração.`:`Deriva cardíaca ${x.dec}%: a FC subiu no fim. Sinal de base aeróbica ainda curta; manter rodagens leves.`);
  if(x.splits&&x.splits.length>=3){const s=x.splits.filter(s=>!s.part);if(s.length>=3){const f=s[0].t,l=s[s.length-1].t;msg.push(l<f-5?'Parciais em progressão negativa: boa disciplina de ritmo.':l>f+15?'Ritmo caiu no fim; segurar mais o início.':'Ritmo estável do começo ao fim.')}}
  if(!msg.length&&pace)msg.push(`Ritmo médio ${fmtP(pace)}/km.`);
  return msg.join(' ');
}

// mapa vetorial (OpenFreeMap + MapLibre, sem chave): nítido em qualquer tela; depois de desenhado vira imagem e o mapa é descartado
const ML='https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl';
const MAPIMG={};let _ml=null;
// cores no padrão do app: fundo preto, ruas em cinza
const MCOR={background:'#000',water:'#15324a',waterway:'#1d3f5c',landuse_residential:'#050505',landcover_wood:'#0c1f13',landuse_park:'#0e2416',building:'#0b0c0e',
  highway_path:'#22262c',highway_minor:'#30353c',highway_major_casing:'#000',highway_major_inner:'#3f454e',highway_major_subtle:'#3f454e',
  highway_motorway_casing:'#000',highway_motorway_inner:'#555c66',highway_motorway_subtle:'#555c66',railway:'#2a2e35',railway_minor:'#2a2e35',railway_transit:'#2a2e35'};
function mlLoad(){
  return _ml||(_ml=new Promise((ok,er)=>{const c=document.createElement('link');c.rel='stylesheet';c.href=ML+'.css';document.head.appendChild(c);
    const s=document.createElement('script');s.src=ML+'.js';s.onload=ok;s.onerror=er;document.head.appendChild(s)})
    .then(()=>fetch('https://tiles.openfreemap.org/styles/dark')).then(r=>r.json()).then(st=>{
      for(const l of st.layers){const c=MCOR[l.id],pt=l.paint=l.paint||{};
        if(c)pt[l.type==='background'?'background-color':l.type==='fill'?'fill-color':'line-color']=c;
        if(l.type==='symbol'&&pt['text-color'])pt['text-color']='#6b727c',pt['text-halo-color']='#000'}
      // verde discreto para parques, praças, gramados e matas (o estilo original não pinta a área dos parques)
      const wd=st.layers.find(l=>l.id==='landcover_wood');if(wd){delete wd.paint['fill-pattern'];wd.paint['fill-opacity']=.85}
      const at=st.layers.findIndex(l=>l.id==='building');
      st.layers.splice(at<0?1:at,0,
        {id:'bn_verde',type:'fill',source:'openmaptiles','source-layer':'landcover',filter:['match',['get','class'],['grass','wood'],true,false],paint:{'fill-color':'#0b1d11','fill-opacity':.85}},
        {id:'bn_parque',type:'fill',source:'openmaptiles','source-layer':'park',paint:{'fill-color':'#0e2416','fill-opacity':.9}});
      return st}).catch(e=>{_ml=null;throw e}));
}
const mapBox=(id,H)=>{const im=MAPIMG[id+'_'+H];return `<div class="map" data-map="${id}" data-h="${H}" style="height:${H}px">${im?`<img class="mimg" src="${im}" alt="">`:''}<span>© OpenFreeMap · OpenStreetMap</span></div>`};
function drawMaps(){
  document.querySelectorAll('.map[data-map]:not(.ok)').forEach(async el=>{
    el.classList.add('ok');const id=el.dataset.map,key=id+'_'+el.dataset.h,tr=(AX[id]||{}).map;
    if(MAPIMG[key]||!tr)return;
    try{
      const st=await mlLoad(),box=document.createElement('div');box.style.cssText='position:absolute;inset:0';el.prepend(box);
      const ll=tr.map(p=>[p[1],p[0]]),b=ll.reduce((b,p)=>b.extend(p),new maplibregl.LngLatBounds(ll[0],ll[0]));
      const m=new maplibregl.Map({container:box,style:st,interactive:false,attributionControl:false,preserveDrawingBuffer:true,fadeDuration:0,bounds:b,fitBoundsOptions:{padding:{top:24,bottom:24,left:28,right:28},maxZoom:17}});
      m.on('load',()=>{
        m.addSource('rt',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:ll}}});
        m.addSource('pt',{type:'geojson',data:{type:'FeatureCollection',features:[ll[0],ll[ll.length-1]].map((c,i)=>({type:'Feature',properties:{f:i},geometry:{type:'Point',coordinates:c}}))}});
        const lay={'line-join':'round','line-cap':'round'};
        m.addLayer({id:'rt0',type:'line',source:'rt',layout:lay,paint:{'line-color':'#000','line-opacity':.6,'line-width':7}});
        m.addLayer({id:'rt1',type:'line',source:'rt',layout:lay,paint:{'line-color':'#4a9eff','line-width':3.5}});
        m.addLayer({id:'pt',type:'circle',source:'pt',paint:{'circle-radius':5,'circle-color':['case',['==',['get','f'],0],'#fff','#4a9eff'],'circle-stroke-width':2.5,'circle-stroke-color':['case',['==',['get','f'],0],'#4a9eff','#fff']}});
        m.once('idle',()=>{MAPIMG[key]=m.getCanvas().toDataURL('image/png');m.remove();box.remove();
          if(!el.isConnected)return;const im=new Image();im.className='mimg';im.alt='';im.src=MAPIMG[key];el.prepend(im)});
      });
    }catch(e){el.classList.add('err')}
  });
}
function ringSvg(v,cls){const c=2*Math.PI*36,col=cls==='ok'?'var(--blue)':cls==='warn'?'var(--amber)':'var(--red)';return `<svg viewBox="0 0 86 86"><circle cx="43" cy="43" r="36" stroke="#161a21" stroke-width="7" fill="none"/><circle cx="43" cy="43" r="36" stroke="${col}" stroke-width="7" fill="none" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 43 43)"/><text x="43" y="49" text-anchor="middle" fill="#fff" font-family="ui-monospace,Menlo,monospace" font-size="20" font-weight="700">${v}</text></svg>`}
function pmcSvg(S,days=90){
  S=S.slice(-days);const w=600,h=120,mx=Math.max(10,...S.map(s=>Math.max(s.ctl,s.atl))),mn=Math.min(-10,...S.map(s=>s.tsb));

  const line=(k,c,dash)=>`<polyline fill="none" stroke="${c}" stroke-width="1.6" ${dash?'stroke-dasharray="3 3"':''} points="${S.map((s,i)=>x(i).toFixed(1)+','+y(s[k]).toFixed(1)).join(' ')}"/>`;
  return `<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:120px"><line x1="0" x2="${w}" y1="${y(0)}" y2="${y(0)}" stroke="#252a31"/>${line('ctl','#4a9eff')}${line('atl','#e0442f')}${line('tsb','#c9a24a',1)}</svg>
  <div class="row meta" style="gap:14px;margin-top:4px"><span><span style="color:var(--blue)">━</span> Forma</span><span><span style="color:var(--red)">━</span> Fadiga</span><span><span style="color:var(--amber)">┅</span> Equilíbrio</span></div>`;
}

const fmtD=ds=>ds.slice(8,10)+'/'+ds.slice(5,7);
const avgOf=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function barsSvg(vals,days,target,col){
  const w=600,h=140,n=vals.length,mx=Math.max(target||0,...vals.filter(v=>v!=null))*1.12||1,bw=w/n,y=v=>h-v/mx*h;
  return `<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:140px;border-bottom:1px solid var(--line)">${vals.map((v,i)=>v==null?'':`<rect x="${(i*bw+bw*.15).toFixed(1)}" y="${y(v).toFixed(1)}" width="${Math.max(1,bw*.7).toFixed(1)}" height="${(h-y(v)).toFixed(1)}" fill="${col(v)}"/>`).join('')}${target?`<line x1="0" x2="${w}" y1="${y(target)}" y2="${y(target)}" stroke="#c9a24a" stroke-width="1.5" stroke-dasharray="6 5"/>`:''}</svg><div class="row meta" style="justify-content:space-between;margin-top:3px"><span>${fmtD(days[0])}</span><span>${fmtD(days[days.length-1])}</span></div>`;
}
function lineSvg(vals,days,col,ref){
  const pts=vals.map((v,i)=>[i,v]).filter(p=>p[1]!=null);if(!pts.length)return '<p class="empty">Sem dados no período.</p>';
  const w=600,h=140,vs=pts.map(p=>p[1]).concat(ref?[ref]:[]),mn=Math.min(...vs)-2,mx=Math.max(...vs)+2,x=i=>vals.length>1?i/(vals.length-1)*w:w/2,y=v=>h-8-(v-mn)/((mx-mn)||1)*(h-16);
  return `<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:140px;border-bottom:1px solid var(--line)">${ref?`<line x1="0" x2="${w}" y1="${y(ref)}" y2="${y(ref)}" stroke="#c9a24a" stroke-width="1.5" stroke-dasharray="6 5"/>`:''}<polyline fill="none" stroke="${col}" stroke-width="2" points="${pts.map(p=>x(p[0]).toFixed(1)+','+y(p[1]).toFixed(1)).join(' ')}"/>${pts.length<25?pts.map(p=>`<circle cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="4" fill="${col}"/>`).join(''):''}</svg><div class="row meta" style="justify-content:space-between;margin-top:3px"><span>${fmtD(days[0])} · ${Math.round(mn+2)}–${Math.round(mx-2)}</span><span>${fmtD(days[days.length-1])}</span></div>`;
}

/* ================= CALENDÁRIO ================= */
let calMode='sem',calRef=TODAY();
function rCal(){
  const ds0=ymd(TODAY());let h=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><div class="seg"><button class="${calMode==='sem'?'on':''}" onclick="calSet('sem')">SEMANAL</button><button class="${calMode==='mes'?'on':''}" onclick="calSet('mes')">MENSAL</button></div><div class="row"><button class="b sm" onclick="calGo(0)">HOJE</button><button class="b sm pri" onclick="openBuilder()" aria-label="Criar treino">+ TREINO</button></div></div>`;
  if(calMode==='sem'){
    const m=monday(calRef),e=addD(m,6);let tk=0,pk=0;
    h+=`<div class="wk"><button class="b sm" onclick="calGo(-1)">◀</button><b>${m.getDate()} ${MES[m.getMonth()]} — ${e.getDate()} ${MES[e.getMonth()]}</b><button class="b sm" onclick="calGo(1)">▶</button></div>`;
    for(let i=0;i<7;i++){const d=addD(m,i),ds=ymd(d),p=planOn(ds),ex=actsOn(ds),w=W(ds)||{};
      const rk=ex.filter(isRun).reduce((s,a)=>s+(a.dist||0),0);tk+=rk;pk+=p?p.km*1000:0;
      h+=`<div class="day ${ds===ds0?'today':''}" onclick="openDay('${ds}')"><div class="d"><span>${DOW[d.getDay()]}</span><b>${pad(d.getDate())}</b></div><div style="min-width:0">
      ${p?`<div class="pl"><span class="tag ${status(p)==='cumprido'?'ok':status(p)==='perdido'?'bad':''}">${tipoIc[p.tipo]}</span> ${esc(p.titulo)} <span class="dim">· ${p.km} km</span></div>`:`<div class="pl dim">${ex.length?'':'Descanso'}</div>`}
      ${ex.map(a=>`<div class="ex">✓ ${typeIc(a)} ${a.dist?km(a.dist)+' km':fmtT(a.mov)}${isRun(a)&&a.dist?' · '+fmtP(a.mov/a.dist*1000)+'/km':''}${a.hr?' · '+a.hr+' bpm':''}</div>`).join('')}</div>
      <div class="vt">${w.sleep?'☾ '+fmtSleep(w.sleep):''}<br>${w.rhr?'♥ '+w.rhr:''}</div></div>`}
    h+=`<div class="card" style="margin-top:8px"><div class="row" style="justify-content:space-between"><span class="lbl">Volume da semana</span><span class="num">${pk?km(tk)+' / '+km(pk):km(tk)} km</span></div>${pk?`<div class="bar"><i style="width:${clamp(tk/pk*100,0,100)}%"></i></div>`:'<div class="meta" style="margin-top:4px">Sem treinos planejados nesta semana.</div>'}</div>`;
  }else{
    const y=calRef.getFullYear(),mo=calRef.getMonth(),f=monday(new Date(y,mo,1));
    h+=`<div class="wk"><button class="b sm" onclick="calGo(-1)">◀</button><b>${MES[mo]} ${y}</b><button class="b sm" onclick="calGo(1)">▶</button></div><div class="mgrid">${['SEG','TER','QUA','QUI','SEX','SÁB','DOM'].map(x=>`<div class="h">${x}</div>`).join('')}`;
    let tot=0;
    for(let i=0;i<42;i++){const d=addD(f,i),ds=ymd(d);if(i>=35&&d.getMonth()!==mo)break;const p=planOn(ds),rk=runsOn(ds).reduce((s,a)=>s+(a.dist||0),0),st=p&&status(p);if(d.getMonth()===mo)tot+=rk;
      h+=`<div class="mc ${d.getMonth()!==mo?'out':''} ${ds===ds0?'today':''}" onclick="openDay('${ds}')"><span class="n">${d.getDate()}</span>${rk?`<span class="k">${(rk/1000).toFixed(1)}</span>`:p?`<span class="k p">${p.km}</span>`:'<span></span>'}${p?`<span class="dot ${st==='cumprido'||st==='parcial'?'f':st==='perdido'?'x':''}"></span>`:rk?'<span class="dot f"></span>':'<span></span>'}</div>`}
    h+=`</div><div class="row meta" style="gap:14px;margin-top:8px"><span><span style="color:var(--blue)">●</span> cumprido</span><span><span style="color:var(--blue)">○</span> planejado</span><span style="color:#ff7a66">● perdido</span></div><div class="card" style="margin-top:10px"><div class="row" style="justify-content:space-between"><span class="lbl">Total corrido no mês</span><span class="num">${km(tot)} km</span></div></div>`;
  }
  $('#cal').innerHTML=h;
}
window.calSet=m=>{calMode=m;rCal()};
window.calGo=n=>{if(!n)calRef=TODAY();else if(calMode==='sem')calRef=addD(calRef,7*n);else calRef=new Date(calRef.getFullYear(),calRef.getMonth()+n,1);rCal()};
window.openDay=ds=>{
  const p=planOn(ds),ex=actsOn(ds),w=W(ds)||{},d=parseD(ds);
  let h=`<div class="hd"><b>${DOW[d.getDay()]} ${ds.split('-').reverse().join('/')}</b><button class="b sm" onclick="closeSheet()">✕</button></div>`;
  if(p)h+=`<div class="card cur"><div class="row" style="justify-content:space-between"><span class="lbl">PLANEJADO · ${tipoIc[p.tipo]}</span>${tagSt[status(p)]}</div><h2 style="margin-top:4px">${esc(p.titulo)}</h2><div class="meta">${p.km} km</div>${stepsHtml(p)}${p.why?`<div class="coach"><b>AJUSTE DO COACH</b>${esc(p.why)}</div>`:''}${ds>=ymd(TODAY())&&hasWatch()?`<button class="b pri full" style="margin-top:10px" onclick="sendWatch('${ds}')">▲ Enviar ao relógio</button>`:''}
    <div class="grid g2" style="margin-top:8px">${ds<=ymd(TODAY())&&status(p)!=='cumprido'?`<button class="b" onclick="markDone('${ds}')">✓ Marcar feito</button>`:''}${ds>=ymd(TODAY())?`<button class="b" onclick="openBuilder('${ds}')">Editar treino</button>`:''}</div></div>`;
  ex.forEach(a=>h+=`<div class="card" onclick="openAct('${a.id}')"><div class="row" style="justify-content:space-between"><span class="lbl">EXECUTADO · ${typeIc(a)}</span>${a.src==='MANUAL'?'<span class="tag">MARCADO À MÃO</span>':''}</div><h2 style="margin-top:4px">${esc(a.name)}</h2><div class="meta">${a.dist?km(a.dist)+' km · ':''}${fmtT(a.mov)}${isRun(a)&&a.dist?' · '+fmtP(a.mov/a.dist*1000)+'/km':''}${a.hr?' · '+a.hr+' bpm':''}</div>${isMan(a)?`<button class="b sm" style="margin-top:8px" onclick="event.stopPropagation();undoMan('${a.id}')">Desfazer</button>`:''}</div>`);
  if(!p&&!ex.length)h+=`<p class="empty">Dia de descanso.</p>`;
  if(!p&&ds>=ymd(TODAY()))h+=`<button class="b full" style="margin:8px 0" onclick="openBuilder('${ds}')">+ Criar treino neste dia</button>`;
  if(!p&&!ex.some(isRun)&&ds<=ymd(TODAY()))h+=`<button class="b full" style="margin:8px 0" onclick="markDone('${ds}')">✓ Registrar corrida feita</button>`;
  h+=`<div class="grid g3" style="margin-top:6px"><div class="cell"><div class="lbl">Sono</div><span class="num">${fmtSleep(w.sleep)}</span></div><div class="cell"><div class="lbl">FC rep.</div><span class="num">${w.rhr||'--'}</span></div><div class="cell"><div class="lbl">Passos</div><span class="num">${w.steps?(w.steps/1000).toFixed(1)+'k':'--'}</span></div></div>`;
  openSheet(h);
};

const METAS=[

  {nome:'MEIA MARATONA',dist:21097.5,ini:'2026-11-01',fim:'2026-12-31',txt:'Completar 21,1 km até o fim de dezembro.'},
  {nome:'30 KM',dist:30000,ini:'2026-11-01',fim:'2027-03-31',txt:'Passar o recorde de 26 km e fechar os 30 km.'},
];
function metas(){
  if(isIgor())return METAS;
  const M=PF&&META[PF.meta];if(!M||!M.d)return [];
  const P=baseTemplate(),fim=P.length?P[P.length-1].date:PF.inicio;
  return [{nome:M.n.toUpperCase(),dist:M.dist,ini:PF.inicio,fim,txt:`Completar ${M.n.toLowerCase()==='meia maratona'?'a meia maratona (21,1 km)':M.n} até ${fim.split('-').reverse().join('/')}.`}];
}
function bestIn(a,dist){
  let b=(AX[a.id]&&AX[a.id].best||{})[dist]||null;
  if(a.dist>=dist*0.99&&a.dist<=dist*1.05&&a.mov){const tt=Math.round(a.mov*dist/a.dist);if(!b||tt<b)b=tt}
  return b;
}
function metaStatus(m){
  const runs=D.acts.filter(a=>isRun(a)&&a.date.slice(0,10)>=m.ini&&a.date.slice(0,10)<=m.fim&&a.dist>=m.dist*0.99);
  let best=null;for(const a of runs){const t=bestIn(a,m.dist)||a.mov;if(t&&(!best||t<best.t))best={t,a}}
  const hoje=ymd(TODAY());
  return {ok:!!best&&(!m.tempo||best.t<=m.tempo),best,dias:Math.round((parseD(m.fim)-TODAY())/864e5),fora:hoje>m.fim,antes:hoje<m.ini};
}
function rDes(){
  const t=TODAY(),m=monday(t),runs=D.acts.filter(isRun);
  const sum=(a,b)=>runs.filter(x=>x.date.slice(0,10)>=a&&x.date.slice(0,10)<=b).reduce((s,x)=>s+(x.dist||0),0)/1000;
  const wk=sum(ymd(m),ymd(addD(m,6))),wkPlan=plan().filter(p=>p.date>=ymd(m)&&p.date<=ymd(addD(m,6))).reduce((s,p)=>s+p.km,0)||15;
  const m1=ymd(new Date(t.getFullYear(),t.getMonth(),1)),m2=ymd(new Date(t.getFullYear(),t.getMonth()+1,0));
  const mo=sum(m1,ymd(t)),moAlvo=isIgor()?(t.getMonth()===10?75:60):Math.round(plan().filter(p=>p.date>=m1&&p.date<=m2).reduce((s,p)=>s+p.km,0))||Math.round(wkPlan*4);
  let seq=0;for(let i=0;i<52;i++){const a=addD(m,-7*i),n=runs.filter(x=>x.date.slice(0,10)>=ymd(a)&&x.date.slice(0,10)<=ymd(addD(a,6))).length;if(n>=2)seq++;else if(i>0)break}
  const ch=[
    ['VOLUME DA SEMANA',`${wk.toFixed(1)} / ${wkPlan} km`,wk/wkPlan],
    [`VOLUME DE ${MES[t.getMonth()]}`,`${mo.toFixed(1)} / ${moAlvo} km`,mo/moAlvo],
    ['CONSTÂNCIA',`${seq} / 4 semanas seguidas com 2+ corridas`,seq/4],
  ];
  let h=`<div class="sec">PROGRESSO</div>`;
  h+=ch.map(c=>{const v=clamp(c[2],0,1);return `<div class="card ${v>=1?'cur':''}"><div class="row" style="justify-content:space-between"><span class="lbl" style="color:var(--txt)">${c[0]}</span><span class="num ${v>=1?'ok':''}" style="font-size:12px">${Math.round(v*100)}%</span></div><div class="meta" style="margin-top:3px">${c[1]}</div><div class="bar"><i style="width:${v*100}%"></i></div></div>`}).join('');
  h+=`<div class="sec">METAS<small>COM PRAZO</small></div>`;
  const MT=metas();
  if(!MT.length)h+=`<div class="card"><p class="empty">Sua meta é criar constância: correr nos dias combinados, semana após semana. Acompanhe no progresso acima.</p></div>`;
  h+=MT.map(mt=>{const s=metaStatus(mt);
    return `<div class="card ${s.ok?'cur':s.fora?'alert':''}"><div class="row" style="justify-content:space-between"><span class="lbl" style="color:var(--txt)">${mt.nome}</span>${s.ok?'<span class="tag ok">✓ CUMPRIDA</span>':s.fora?'<span class="tag bad">PRAZO ENCERRADO</span>':'<span class="tag">PENDENTE</span>'}</div>
    <div class="meta" style="margin-top:4px;color:var(--txt)">${mt.txt}</div>
    <div class="row meta" style="justify-content:space-between;margin-top:8px"><span>Prazo: ${mt.fim.split('-').reverse().join('/')}</span><span>${s.ok?'Feita em '+fmtD(s.best.a.date)+(mt.tempo?' · '+fmtT(s.best.t):''):s.fora?'':s.antes?'Começa em '+fmtD(mt.ini):'Faltam '+s.dias+' dias'}</span></div>
    ${!s.ok&&s.best&&mt.tempo?`<div class="meta" style="margin-top:4px">Melhor tentativa: ${fmtT(s.best.t)} (faltam ${fmtT(s.best.t-mt.tempo)})</div>`:''}</div>`}).join('');
  $('#des').innerHTML=h;
}

  return [me,...Object.entries(FR).filter(([id,f])=>id!==CFG.athlete&&f.runs&&f.runs.length).map(([id,f])=>({id,name:f.name||id,pic:f.pic||'logo.png',runs:f.runs}))];
}
function buildPlaces(P){

  for(const u of P)for(const r of u.runs){const c=cen(r.map);let pl=L.find(l=>dM(l.c,c)<900);
    if(!pl){pl={c,runs:[]};L.push(pl)}pl.runs.push({u,r});const n=pl.runs.length;pl.c=[pl.c[0]+(c[0]-pl.c[0])/n,pl.c[1]+(c[1]-pl.c[1])/n]}

// ritmo atual: últimos 30 s do trecho em andamento
function curPace(){const P=REC&&REC.pts,n=P?P.length:0;if(n<2||REC.st!=='run'||Date.now()-P[n-1][0]>15000)return null;let i=n-1,d=0;
  while(i>0&&P[n-1][0]-P[i-1][0]<=30000&&P[i-1][4]===P[n-1][4]){d+=hav([P[i-1][1],P[i-1][2]],[P[i][1],P[i][2]]);i--}
  const dt=(P[n-1][0]-P[i][0])/1000;return d>15&&dt>0?dt/d*1000:null}
function recUI(){
  const fb=$('#recfab-t');if(fb)fb.textContent=REC?fmtT(recMov()):'';
  if(!$('#rec').classList.contains('on'))return;
  const st=REC?REC.st:'idle',t=recMov(),d=REC?REC.dist:0,done=REC?REC.splits.reduce((s,x)=>s+x,0):0;
  $('#r-t').textContent=fmtT(t);$('#r-d').innerHTML=(d/1000).toFixed(2)+'<small> km</small>';
  $('#r-pa').innerHTML=fmtP(curPace())+'<small>/km</small>';$('#r-pm').innerHTML=(d>50?fmtP(t/d*1000):'--')+'<small>/km</small>';
  const kd=d%1000;$('#r-pk').innerHTML=(kd>50?fmtP((t-done)/kd*1000):'--')+`<small> km ${Math.floor(d/1000)+1}</small>`;
  $('#r-gps').innerHTML=!FIX?'<span class="warn">PROCURANDO GPS…</span>':FIX.acc<=12?'<span class="ok">GPS ÓTIMO</span>':FIX.acc<=30?'<span class="ok">GPS BOM</span>':'<span class="bad">GPS FRACO</span>';
  $('#r-min').textContent=st==='idle'?'✕':'⌄';
  const want=st==='idle'?'i':st;if($('#r-ctl').dataset.st!==want){$('#r-ctl').dataset.st=want;
    $('#r-ctl').innerHTML=st==='idle'?`<button class="rbtn" onclick="recGo()">INICIAR</button>`:st==='run'?`<button class="rbtn amb" onclick="recPause()">PAUSAR</button>`:`<button class="rbtn" onclick="recGo()">CONTINUAR</button><button class="rbtn red" onclick="recEnd()">FINALIZAR</button>`}
  $('#r-st').textContent=st==='pause'?'PAUSADO':st==='run'?'GRAVANDO':'';
}
function recDraw(){
  if(!RM||!RM.getSource('rt'))return;
  const segs={};(REC?REC.pts:[]).forEach(q=>(segs[q[4]]=segs[q[4]]||[]).push([q[2],q[1]]));
  RM.getSource('rt').setData({type:'Feature',geometry:{type:'MultiLineString',coordinates:Object.values(segs).filter(s=>s.length>1)}});
  if(FIX){const c=[FIX.ll[1],FIX.ll[0]];RM.getSource('me').setData({type:'Feature',geometry:{type:'Point',coordinates:c}});
    if(!RM._fixou){RM.jumpTo({center:c,zoom:16});RM._fixou=1}else if(recLive())RM.easeTo({center:c,duration:600})}
}
window.openRec=()=>{
  if(!CFG.key)return toast('CONECTE O INTERVALS EM MAIS');
  const el=$('#rec');
  if(!el.innerHTML){const p=planOn(ymd(TODAY()));
    el.innerHTML=`<div class="rtop"><button class="b sm" id="r-min" onclick="closeRec()" aria-label="Fechar">✕</button><div style="text-align:center"><b style="font-size:12px;letter-spacing:.14em;color:var(--amber)">GRAVAR CORRIDA</b><div class="meta" id="r-gps"></div></div><button class="b sm" id="r-voz" onclick="togVoz()" aria-label="Voz"></button></div>
    <div id="rmap"><span class="chip" id="r-st" style="position:absolute;z-index:2;left:10px;top:10px;color:var(--red);border-color:var(--red)"></span></div>
    <div class="rmet"><div class="meta" style="text-align:center;min-height:14px">${p?'Treino de hoje: '+esc(p.titulo):''}</div><div class="rbig" id="r-t">0:00</div><div class="lbl" style="text-align:center;margin-top:3px">TEMPO EM MOVIMENTO</div>
    <div class="grid g2" style="margin-top:12px"><div class="cell"><div class="lbl">Distância</div><span class="num big" id="r-d"></span></div><div class="cell"><div class="lbl">Ritmo atual</div><span class="num big" id="r-pa"></span></div><div class="cell"><div class="lbl">Ritmo médio</div><span class="num" id="r-pm"></span></div><div class="cell"><div class="lbl">Km atual</div><span class="num" id="r-pk"></span></div></div></div>
    <div class="rctl" id="r-ctl"></div>`}
  $('#r-voz').textContent=LS.get('voz',1)?'🔊':'🔇';
  el.classList.add('on');$('#recfab').classList.remove('on');recWatch(1);
  clearInterval(RTK);RTK=setInterval(recUI,1000);recUI();
  mlLoad().then(st=>{
    if(RM){RM.resize();recDraw();return}
    RM=new maplibregl.Map({container:'rmap',style:structuredClone(st),center:FIX?[FIX.ll[1],FIX.ll[0]]:[-48.277,-18.918],zoom:FIX?16:12,dragRotate:false,pitchWithRotate:false,attributionControl:{compact:true,customAttribution:'OpenFreeMap'}});
    RM.on('load',()=>{
      RM.addSource('rt',{type:'geojson',data:{type:'Feature',geometry:{type:'MultiLineString',coordinates:[]}}});RM.addSource('me',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
      RM.addLayer({id:'rt0',type:'line',source:'rt',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#000','line-opacity':.6,'line-width':8}});
      RM.addLayer({id:'rt1',type:'line',source:'rt',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#4a9eff','line-width':4.5}});
      RM.addLayer({id:'me0',type:'circle',source:'me',paint:{'circle-radius':18,'circle-color':'#4a9eff','circle-opacity':.2}});
      RM.addLayer({id:'me',type:'circle',source:'me',paint:{'circle-radius':7,'circle-color':'#fff','circle-stroke-color':'#4a9eff','circle-stroke-width':3}});
      recDraw()});
  }).catch(()=>{});
};
window.closeRec=()=>{$('#rec').classList.remove('on');if(!recLive()){recWatch(0);clearInterval(RTK);RTK=null}render()};
window.togVoz=()=>{LS.set('voz',LS.get('voz',1)?0:1);$('#r-voz').textContent=LS.get('voz',1)?'🔊':'🔇'};
window.recGo=()=>{
  if(!REC||REC.st==='idle'){REC={st:'run',seg:0,pts:[],dist:0,mov:0,since:Date.now(),splits:[],t0:Date.now()};say('Gravação iniciada. Bom treino.')}
  else if(REC.st==='pause'){REC.st='run';REC.since=Date.now();REC.seg++;say('Continuando.')}
  recKeep();wake(1);recUI();
};
window.recPause=()=>{if(!REC||REC.st!=='run')return;REC.mov+=Date.now()-REC.since;REC.st='pause';recKeep();say('Pausado.');recUI()};
function recStats(){const P=REC.pts,t0=P.length?P[0][0]:REC.t0,t=[],d=[];let c=0;P.forEach((q,i)=>{if(i&&P[i-1][4]===q[4])c+=hav([P[i-1][1],P[i-1][2]],[q[1],q[2]]);t.push((q[0]-t0)/1000);d.push(c)});return {t0,t,d}}
window.recEnd=()=>{
  if(REC.st==='run')recPause();
  if(REC.dist<50&&!confirm('A corrida tem menos de 50 m. Finalizar mesmo assim?'))return;
  const mv=recMov(),p=planOn(ymd(TODAY()));
  openSheet(`<div class="hd"><b>CORRIDA FINALIZADA</b><button class="b sm" onclick="closeSheet()">✕</button></div>
  <div class="grid g3"><div class="cell"><div class="lbl">Distância</div><span class="num">${km(REC.dist)}<small> km</small></span></div><div class="cell"><div class="lbl">Tempo</div><span class="num">${fmtT(mv)}</span></div><div class="cell"><div class="lbl">Ritmo</div><span class="num">${REC.dist>50?fmtP(mv/REC.dist*1000):'--'}</span></div></div>
  ${REC.splits.length?`<div class="sec">PARCIAIS</div><table><tr><th>KM</th><th class="r">Ritmo</th></tr>${REC.splits.map((s,i)=>`<tr><td>${i+1}</td><td class="r">${fmtP(s)}</td></tr>`).join('')}</table>`:''}
  <label class="f">Nome da corrida</label><input id="r-nome" value="${esc(p?p.titulo:'Corrida')}">
  <button class="b pri full" style="margin-top:14px" onclick="recSave()">Salvar</button>
  <div class="grid g2" style="margin-top:8px"><button class="b" onclick="closeSheet()">Voltar a gravar</button><button class="b red" onclick="recTrash()">Descartar</button></div>`);
};
window.recTrash=()=>{if(!confirm('Descartar esta corrida? Ela não poderá ser recuperada.'))return;recClear();closeSheet();toast('CORRIDA DESCARTADA')};
function recClear(){REC=null;LS.set('rec',null);wake(0);recWatch(0);clearInterval(RTK);RTK=null;$('#rec').classList.remove('on');$('#rec').innerHTML='';if(RM){RM.remove();RM=null}render()}
function toGpx(name){
  let s=`<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Boonie Run" xmlns="http://www.topografix.com/GPX/1/1"><metadata><time>${new Date(REC.pts[0][0]).toISOString()}</time></metadata><trk><name>${esc(name)}</name><type>running</type>`,seg=null;
  for(const q of REC.pts){if(q[4]!==seg){if(seg!==null)s+='</trkseg>';s+='<trkseg>';seg=q[4]}s+=`<trkpt lat="${q[1]}" lon="${q[2]}">${q[3]!=null?`<ele>${q[3]}</ele>`:''}<time>${new Date(q[0]).toISOString()}</time></trkpt>`}
  return s+'</trkseg></trk></gpx>';
}
async function upGpx(name,gpx){
  const fd=new FormData();fd.append('file',new Blob([gpx],{type:'application/gpx+xml'}),'boonie-run.gpx');
  const r=await fetch(`${API}/athlete/${CFG.athlete}/activities?name=${encodeURIComponent(name)}`,{method:'POST',headers:{Authorization:'Basic '+btoa('API_KEY:'+CFG.key)},body:fd});
  if(!r.ok)throw new Error('HTTP '+r.status);
}
window.recSave=async()=>{
  if(!REC.pts.length)return toast('SEM PONTOS DE GPS PARA SALVAR');
  const name=$('#r-nome').value.trim()||'Corrida',gpx=toGpx(name),btn=document.querySelector('#sbox .b.pri');btn.disabled=true;btn.textContent='Enviando…';
  try{await upGpx(name,gpx);toast('CORRIDA SALVA NO INTERVALS',3000);closeSheet();recClear();setTimeout(()=>sync(0),5000)}
  catch(e){ // sem internet ou o Intervals recusou: guarda no celular e deixa reenviar depois
    const {t0,t,d}=recStats(),id='man-'+Date.now();
    AX[id]=analyze(t,d,[],[],{data:REC.pts.map(q=>q[1]),data2:REC.pts.map(q=>q[2])});LS.set('ax5',AX);LS.set('gpx.'+id,gpx);
    MAN.push({id,date:isoLocal(t0),type:'Run',name,dist:Math.round(REC.dist),mov:Math.round(recMov()),el:Math.round(t[t.length-1]||0),src:'APP',gpx:1});LS.set('man',MAN);
    D.acts=withMan(D.acts);LS.set('data',D);closeSheet();recClear();toast('SALVA NESTE CELULAR // REENVIE PELO DETALHE DA CORRIDA',4500)}
};
window.resendGpx=async id=>{
  const a=MAN.find(m=>m.id===id),gpx=LS.get('gpx.'+id,null);if(!a||!gpx)return;
  try{await upGpx(a.name,gpx);MAN=MAN.filter(m=>m.id!==id);LS.set('man',MAN);LS.set('gpx.'+id,null);D.acts=withMan(D.acts);LS.set('data',D);closeSheet();toast('ENVIADA AO INTERVALS',3000);setTimeout(()=>sync(0),5000)}
  catch(e){toast('AINDA NÃO DEU // '+e.message,3500)}
};
if(recLive()){recWatch(1);RTK=setInterval(recUI,1000)}

/* ================= navegação ================= */
const TITLES={ini:'INÍCIO',cal:'CALENDÁRIO',des:'DESAFIOS',comp:'COMPETITIVO',mais:'MAIS',perf:'PERFIL'};
let VIEW='ini';
function go2(v){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
function go(v){VIEW=v;go2(v);render()}
document.querySelectorAll('#tabbar button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#av').onclick=()=>go(VIEW==='perf'?'ini':'perf');
$('#sync').onclick=()=>sync(0);
function render(){
  const ob=needOB();document.body.classList.toggle('ob',ob);
  const fab=$('#recfab');fab.classList.toggle('on',!ob&&!!CFG.key&&(VIEW==='ini'||recLive())&&!$('#rec').classList.contains('on'));fab.classList.toggle('live',recLive());
  if(ob){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-ini'));$('#ttl').textContent='BOAS-VINDAS';rOB();return}
  if(VIEW==='ini'||!$('#v-'+VIEW).classList.contains('on'))go2(VIEW);
  $('#ttl').textContent=TITLES[VIEW];
  $('#avimg').src=myPic();
  $('#avst').className=D.at&&Date.now()-D.at<864e5?'on':D.at?'off':'';
  ({ini:rIni,cal:rCal,des:rDes,comp:rComp,mais:rMais,perf:rPerf})[VIEW]();
  drawMaps();
}
window.sync=sync;window.sendWatch=sendWatch;
render();
if(CFG.key&&(!D.at||Date.now()-D.at>30*60e3))sync(0);
</script>
</body>
